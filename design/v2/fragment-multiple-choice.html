<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" id="invincible-icons" aria-hidden="true">
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 9l4 4M21 9l-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-status-new" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v18H7.5A2.5 2.5 0 0 0 5 22V4.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19 17H7.5A2.5 2.5 0 0 0 5 19.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  </svg>

  <main class="session-screen" data-screen-label="1a Session">
    <aside class="session-sidebar">
      <span class="brand-mark">MK</span>
      <button class="session-sidebar-toggle" type="button" aria-label="Collapse sidebar">
        <svg class="session-icon" viewBox="0 0 24 24"><use href="#i-arrow-right"/></svg>
      </button>
    </aside>

    <section class="session-main">
      <header class="v2-topbar session-topbar">
        <span class="v2-topbar-context">/ DECK · KITCHENWARE</span>
        <div class="session-progress-wrap">
          <div class="session-progress" aria-label="6 of 10 complete">
            <i class="complete"></i><i class="complete"></i><i class="current"></i><i class="complete"></i><i class="complete"></i><i class="complete"></i><i class="skipped"></i><i class="pending"></i><i class="pending"></i><i class="pending"></i>
          </div>
          <span class="session-counter">6 / 10</span>
        </div>
        <div class="session-actions">
          <button class="session-icon-button" type="button" aria-label="Settings"><svg class="session-icon" viewBox="0 0 24 24"><use href="#i-settings"/></svg></button>
          <button class="session-icon-button" type="button" aria-label="Mute audio"><svg class="session-icon" viewBox="0 0 24 24"><use href="#i-mute"/></svg></button>
          <button class="session-icon-button" type="button" aria-label="End session"><svg class="session-icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
        </div>
      </header>

      <div class="session-surface">
        <article class="session-card">
          <div class="session-card-header">
            <span class="session-status"><svg viewBox="0 0 24 24"><use href="#i-status-new"/></svg>New</span>
            <span class="session-direction">ES -&gt; EN</span>
            <button class="session-ghost-button" type="button" aria-label="More options"><svg viewBox="0 0 24 24"><use href="#i-more"/></svg></button>
          </div>
          <div class="session-image-slot"><image-slot id="ses-1a-word" shape="square" fit="cover" placeholder="Word image - la cuchara"></image-slot></div>
          <div class="session-word-row"><div class="session-word">la cuchara</div><button class="session-ghost-button" type="button" aria-label="Play pronunciation"><svg viewBox="0 0 24 24"><use href="#i-volume"/></svg></button></div>
          <div class="session-phonetic-slot">/la ku.tSa.ra/</div>
          <div class="session-definition-slot"><p>utensilio con un cuenco poco profundo y un mango, usado para comer o servir comida</p><button class="session-ghost-button" type="button" aria-label="Play definition"><svg viewBox="0 0 24 24"><use href="#i-volume"/></svg></button></div>
          <div class="session-translation-slot">
            <button class="session-ghost-button session-dictionary-button" type="button" aria-label="Open in dictionary">
              <svg viewBox="0 0 24 24"><use href="#i-book"/></svg>
            </button>
          </div>
        </article>

        <div class="session-options" aria-label="Answer options">
          <div class="state-item incorrect"><span class="option-number">1</span><span class="option-text">fork</span></div>
          <div class="state-item correct"><span class="option-number">2</span><span class="option-text">spoon</span></div>
          <div class="state-item default"><span class="option-number">3</span><span class="option-text">the large wooden serving spoon used at dinner</span></div>
          <div class="state-item focus"><span class="option-number">4</span><span class="option-text">plate</span></div>
        </div>

        <div class="session-hints"><span>1-4 SELECT</span><span>SPACE REPLAY</span><span>ENTER CONFIRM</span></div>
      </div>
    </section>
  </main>
</body>
</html>
