<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 · Setup · Download · All three</title>
  <link rel="stylesheet" href="./wireframe.css">
</head>
<body>
  <div class="setup-frame">
    <div class="setup">

      <header class="setup-header">
        <div class="headline">Downloading French</div>
      </header>

      <div class="setup-content">
        <div class="setup-list">
          <div class="setup-row">
            <span class="name">Dictionary</span>
            <span class="track"><i style="width:64%"></i></span>
            <span class="size">16 of 25 MB</span>
          </div>
          <div class="setup-row waiting">
            <span class="name">Voice</span>
            <span class="track"><i style="width:0"></i></span>
            <span class="size">waiting</span>
          </div>
          <div class="setup-row waiting">
            <span class="name">Sentence translation</span>
            <span class="track"><i style="width:0"></i></span>
            <span class="size">waiting</span>
          </div>
        </div>

        <button class="btn primary action disabled">Start learning</button>
      </div>

    </div>
  </div>
</body>
</html>
