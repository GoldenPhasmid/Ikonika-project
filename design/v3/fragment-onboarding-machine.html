<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 · Setup · Another machine</title>
  <link rel="stylesheet" href="./wireframe.css">
</head>
<body>
  <div class="setup-frame">
    <div class="setup">

      <header class="setup-header">
        <div class="headline">Bring your words over</div>
      </header>

      <div class="setup-content">
        <div class="setup-list">
          <div class="setup-row stacked">
            <span class="path">C:\Users\alex\AppData\Roaming\Ikonika\Ikonika.db</span>
          </div>
          <div class="setup-row">
            <span class="name">Decks</span>
            <span class="size">12</span>
          </div>
          <div class="setup-row">
            <span class="name">Words</span>
            <span class="size">1,246</span>
          </div>
          <div class="setup-row">
            <span class="name">Learning</span>
            <span class="size">French from English</span>
          </div>
          <div class="setup-row">
            <span class="name">Last used</span>
            <span class="size">2 days ago</span>
          </div>
        </div>

        <div class="stack">
          <button class="btn primary action">Merge into this machine</button>
          <button class="btn ghost">Choose a different file</button>
        </div>

        <span class="setup-note">Nothing on this machine is deleted. Both sides are kept.</span>
      </div>

    </div>
  </div>
</body>
</html>
