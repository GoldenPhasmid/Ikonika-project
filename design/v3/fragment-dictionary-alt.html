<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 · Dictionary · translates to</title>
  <link rel="stylesheet" href="./wireframe.css">
</head>
<body>
  <div class="app">

    <aside class="rail">
      <div class="rail-head">
        <div class="rail-mark">AK</div>
        <div class="rail-lang">FR / EN</div>
      </div>
      <nav class="rail-nav">
        <a class="rail-item"><i class="rail-icon"></i><span class="label">Today</span><span class="count">54</span></a>
        <a class="rail-item"><i class="rail-icon"></i><span class="label">Decks</span><span class="count">12</span></a>
        <a class="rail-item"><i class="rail-icon"></i><span class="label">Reader</span></a>
        <a class="rail-item"><i class="rail-icon"></i><span class="label">YouTube</span></a>
        <a class="rail-item active"><i class="rail-icon"></i><span class="label">Dictionary</span></a>
        <a class="rail-item"><i class="rail-icon"></i><span class="label">Numbers</span></a>
        <a class="rail-item"><i class="rail-icon"></i><span class="label">Time</span></a>
        <a class="rail-item"><i class="rail-icon"></i><span class="label">Settings</span></a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="topbar-context">/ DICTIONARY / MARKET</span>
        <div class="topbar-actions"></div>
      </header>

      <div class="content" style="display:flex;flex-direction:column;gap:28px;overflow:auto">

        <div class="dict-search">
          <input value="market" aria-label="Search">
          <button class="btn primary">Search</button>
        </div>

        <!-- The typed word is a native one, so it has no headword of its own. The
             translations table is asked instead and the target words that translate
             to it come back in teaching order. Clicking one opens its real entry. -->
        <div class="card" style="display:flex;flex-direction:column;gap:16px;padding:20px">
          <div style="font-size:22px">No word "market" — these words translate to it:</div>

          <div class="wf-row" style="gap:16px">
            <span style="font-size:16px;text-decoration:underline;cursor:pointer">le marché</span>
            <span class="meta">noun</span>
            <span class="badge">top 1k</span>
            <span class="badge">A1</span>
            <span class="wf-grow"></span>
          </div>

          <div class="wf-row" style="gap:16px">
            <span style="font-size:16px;cursor:pointer">la place</span>
            <span class="meta">noun</span>
            <span class="badge">top 1k</span>
            <span class="badge">A2</span>
            <span class="wf-grow"></span>
          </div>

          <div class="wf-row" style="gap:16px">
            <span style="font-size:16px;cursor:pointer">le débouché</span>
            <span class="meta">noun</span>
            <span class="badge">top 10k</span>
            <span class="badge">B2</span>
            <span class="wf-grow"></span>
          </div>

          <div class="wf-row" style="gap:16px">
            <span style="font-size:16px;cursor:pointer">commercialiser</span>
            <span class="meta">verb</span>
            <span class="badge">top 10k</span>
            <span class="wf-grow"></span>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
