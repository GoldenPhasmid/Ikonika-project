<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 · Setup · Language</title>
  <link rel="stylesheet" href="./wireframe.css">
</head>
<body>
  <div class="setup-frame">
    <div class="setup">

      <header class="setup-header">
        <div class="headline">What are you learning?</div>
      </header>

      <div class="setup-content">
        <div class="setup-field">
          <span class="label">Learning</span>
          <div class="setup-select"><span>French</span><span class="caret">▾</span></div>
        </div>

        <div class="setup-field">
          <span class="label">From</span>
          <div class="setup-select"><span>English</span><span class="caret">▾</span></div>
        </div>

        <div class="setup-list">
          <div class="setup-row">
            <span class="box locked"></span>
            <span class="name">Dictionary</span>
            <span class="size">25 MB</span>
          </div>
          <div class="setup-row">
            <span class="box"></span>
            <span class="name">Voice</span>
            <span class="size">34 MB</span>
          </div>
          <div class="setup-row">
            <span class="box"></span>
            <span class="name">Sentence translation</span>
            <span class="size">68 MB</span>
          </div>
        </div>

        <button class="btn primary action">Continue · 25 MB</button>
      </div>

    </div>
  </div>
</body>
</html>
