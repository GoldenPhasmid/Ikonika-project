<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck detail studies</title>
<style>
@font-face{font-family:Inter;src:url(../app/fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../app/fonts/Inter-SemiBold.ttf)}
:root{--page:#e4e1d7;--paper:#efede5;--ink:#2e2a25;--muted:#57534b;--edge:#cbc6b8;--cover:#8f4a48;--white:#f2f0e9}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px Inter,sans-serif}
main{max-width:848px;margin:clamp(20px,6vh,64px) auto;padding:0 16px}
header,.line,.meta,.actions,.identity,summary,button,label{display:flex;align-items:center}
header,.line{justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:0 0 10px;color:var(--muted)}
section{margin-top:32px}article{container-type:inline-size;margin:auto;background:var(--paper);border:1px solid var(--edge);border-radius:8px;box-shadow:0 2px 4px #2e2a250a}
.phone article{max-width:390px}.frame{max-width:784px;margin:auto;padding:16px 32px}
button,select,summary{font:inherit;cursor:pointer;color:inherit}
button,select{border:1px solid var(--edge);background:transparent;border-radius:8px}
.mode{display:flex;background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:3px}
.mode button{border:none;padding:6px 12px}.mode [aria-pressed=true]{color:var(--paper);background:var(--ink)}
.cover,.book{background-color:var(--cover);color:var(--white);position:relative;isolation:isolate;overflow:hidden}
.cover{border-radius:7px 7px 0 0}.cover:after,.book:after{content:"";position:absolute;z-index:-1;bottom:0;right:0;width:100px;height:100%;background:linear-gradient(132deg,transparent 52%,#ffffff14 52% 64%,transparent 64% 69%,#ffffff14 69% 81%,transparent 81%)}
.title{margin:0;font-size:24px;font-weight:600;line-height:1.2}.desc{margin:4px 0 0;line-height:1.4}.identity{gap:16px}
.meta,.actions{gap:8px}.actions button{height:44px;justify-content:center;padding:0 16px;gap:8px;font-weight:600}
.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.book{width:52px;height:68px;border-radius:3px 7px 7px 3px;border-left:5px solid #713b39;display:grid;place-items:center;flex:none}
select{height:36px;padding:0 6px;font-size:13px}label{min-height:36px;gap:6px;white-space:nowrap;font-size:13px}input{accent-color:var(--ink);width:16px;height:16px}
details{position:relative}summary{list-style:none;justify-content:center;width:36px;height:36px;border-radius:8px}summary::-webkit-details-marker{display:none}summary:hover,button:hover{filter:brightness(.94);background-color:#2e2a2512}.primary:hover{background:var(--ink)}
.menu{position:absolute;right:0;top:100%;z-index:5;background:var(--paper);color:var(--ink);padding:4px;border:1px solid var(--edge);border-radius:8px;min-width:152px;box-shadow:0 4px 16px #2e2a2526}
.menu button{border:0;width:100%;padding:8px;text-align:left}.menu button:last-child{color:#a23a37;border-top:1px solid var(--edge);border-radius:0}
.jacket{position:relative}.jacket>details{position:absolute;right:32px;top:16px;color:var(--white)}.cover .frame{padding-right:80px}.cover .meta{margin-bottom:8px}.cover select{border-color:#f2f0e95c;color:var(--white)}option{color:var(--ink);background:var(--paper)}
.catalog .frame{display:grid;grid-template-columns:1fr auto;gap:12px 16px}.catalog .actions{grid-column:2;grid-row:1/3;flex-direction:column;justify-content:center}.catalog .actions button{width:128px}.catalog .meta{margin-left:68px}.catalog .meta details{margin-left:auto}
@container(max-width:600px){.frame{padding:16px}.title{font-size:20px}.jacket>details{right:16px}.jacket .line{align-items:stretch;flex-direction:column-reverse;gap:4px}.actions button{height:48px;flex:1}.catalog .frame{grid-template-columns:1fr}.catalog .actions{grid-column:1;grid-row:3;flex-direction:row}.catalog .meta{margin:0}.catalog .actions button{width:auto}.meta{flex-wrap:wrap}summary,select,label{min-height:44px}summary{width:44px}}
.jacket .cover .frame{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:start;gap:16px;padding-right:32px}
.deck-symbol{width:48px;height:48px}
.deck-tools{display:flex;gap:4px}
.deck-tools button{width:36px;height:36px;justify-content:center;border:0}
.jacket .actions button{width:150px}
@container(max-width:600px){
 .jacket .cover .frame{grid-template-columns:48px minmax(0,1fr);padding-right:16px;row-gap:4px}
 .deck-tools{grid-column:2}
 .deck-tools button{height:44px;width:44px}
 .jacket .line{flex-direction:column;align-items:stretch;gap:8px}
 .jacket .actions button{width:auto}
}
.jacket{background:var(--cover);color:var(--white);isolation:isolate;overflow:hidden;border-radius:7px}
.jacket::before{content:"";position:absolute;z-index:-1;right:0;bottom:0;width:350px;aspect-ratio:1.7;background:#0000001a;clip-path:polygon(14% 100%,47% 100%,100% 53%,100% 22%)}
.jacket .cover{background:transparent}
.jacket .cover:after{display:none}
.jacket .actions button,.jacket select{border-color:#f2f0e980}
.jacket .primary{background:var(--white);color:#262624}
.jacket input{accent-color:var(--white)}
.jacket .prefs{display:flex;align-items:center;gap:12px}
.pref-field{position:relative;display:grid;align-content:center;gap:2px}
.pref-field small{font-size:11px;opacity:.8}
.jacket .pref-field select{height:22px;min-height:0;background:transparent;border:0;font:600 13px Inter;padding:0;color:inherit}
.prefs label{margin:0;padding-left:12px;border-left:1px solid #f2f0e94d;gap:8px}
.prefs input{margin:0}
.phone section{max-width:390px;margin:24px auto}
.handset{padding:16px;color:var(--white);background:var(--cover);border-radius:7px}
.handset .identity{align-items:flex-start;gap:12px}
.handset .identity>svg{height:44px;width:44px}
.handset .title{font-size:20px}
.handset .desc{font-size:13px}
.handset .deck-tools{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0;gap:4px}
.handset .deck-tools button{height:48px;width:100%;flex-direction:column;gap:3px;font-size:12px}
.handset .actions button{flex:1;height:48px;border-color:#f2f0e980}
.handset .primary{color:#262624;background:var(--white)}
.handset .prefs{display:grid;grid-template-columns:1fr 1fr;align-items:center;border-top:1px solid #f2f0e94d;margin-top:12px;padding-top:8px}
.handset .pref-field,.handset label{min-height:44px}
.handset select{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.handset label{justify-content:center}
.handset .pref-field:focus-within{outline:2px solid currentColor}
.variants{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:20px auto 0}.variants button{padding:8px 12px;font-size:13px}.variants [aria-pressed=true]{background:var(--ink);color:var(--white)}
.options{display:flex;align-items:center;justify-content:space-between;gap:8px;color:inherit}.handset .options{margin-top:12px}.options button,.options label{margin:0;min-height:36px;padding:0 8px;display:flex;gap:8px;align-items:center;color:inherit;font:500 13px Inter;cursor:pointer;border:0;white-space:nowrap}.options input{width:16px;height:16px;margin:0;accent-color:var(--white)}.options svg{width:16px;height:16px}
.tag button{border-radius:18px;background:#ffffff1c}.tag label{padding-right:0}.strip{border-block:1px solid #ffffff40;gap:0}.strip label{border-left:1px solid #ffffff40}.strip button,.strip label{border-radius:0;padding-inline:12px}
.tabs{align-items:stretch;gap:4px}.tabs button,.tabs label{background:#0002;border-radius:8px;align-items:flex-start;justify-content:center;flex-direction:column;gap:3px;padding:6px 12px}.tabs small{font-size:11px}.tabs span{display:flex;align-items:center;gap:6px}.handset .options button,.handset .options label{min-height:44px}.handset .tabs>*{flex:1}.handset .strip>*{flex:1;justify-content:center}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:12px;padding:16px;width:min(320px,90vw)}dialog::backdrop{background:#0005}dialog h2{margin:0}dialog button{min-height:44px}dialog form>button{width:100%;border:0;justify-content:space-between}.phone dialog{margin:auto auto 0;border-radius:16px 16px 0 0;width:min(390px,100vw)}
</style>
<main><header><h1>Deck detail</h1><div class="mode"><button aria-pressed="true">Desktop</button><button aria-pressed="false">Phone</button></div></header><nav class="variants" aria-label="Settings layout"></nav><div id="studies"></div><dialog><form method="dialog"><header><h2>Deck category</h2><button value="cancel">Close</button></header></form></dialog></main>
<script>
const paths={learn:'M4 5q4-2 8 1 4-3 8-1v14q-4-2-8 1-4-3-8-1z M12 6v14',practice:'M4 10a8 8 0 1 1 1 7 M4 4v6h6',more:'M5 12h.1 M12 12h.1 M19 12h.1',bag:'M4 8h16l-1 12H5z M8 9V7a4 4 0 0 1 8 0v2'};
const icon=k=>'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[k]+'" '+(k==='more'?'style="stroke-width:3.5"':'')+'/></svg>';
const title='<div><p class="title">At the market</p><p class="desc">Food, quantities and phrases for shopping in French.</p></div>';
const category='<select aria-label="Deck category"><option>Everyday life</option><option>No category</option></select>';
const daily='<label><input type="checkbox" checked>Daily learning</label>';
const actions='<div class="actions"><button class="primary">'+icon('learn')+'Learn 12</button><button>'+icon('practice')+'Practice</button></div>';
const manage='<details><summary aria-label="Manage deck" title="Manage deck">'+icon('more')+'</summary><div class="menu">'+['Edit deck','Import','Export','Delete deck'].map(s=>'<button>'+s+'</button>').join('')+'</div></details>';
Object.assign(paths,{edit:'M4 16l-1 5 5-1L20 8l-4-4z M13 7l4 4',import:'M12 3v12m-5-5 5 5 5-5 M4 16v5h16v-5',export:'M12 16V3m-5 5 5-5 5 5 M4 16v5h16v-5',delete:'M3 6h18 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7m4-7v7'});
const deckTools='<div class="deck-tools">'+Object.entries({edit:'Edit deck',import:'Import',export:'Export',delete:'Delete deck'}).map(([key,label])=>'<button title="'+label+'" aria-label="'+label+'">'+icon(key)+'</button>').join('')+'</div>';
const prefs='<div class="prefs"><div class="pref-field"><small>Category</small>'+category+'</div>'+daily+'</div>';
const mobilePrefs=prefs.replace(category,'<strong>Everyday life ⌄</strong>'+category);
const mobileTools=deckTools.replace(/(<button title="([^"]+)"[^>]*>.*?<\/svg>)/g,(_,button,label)=>button+label.replace(' deck',''));
const mobile='<section><article><div class="handset"><div class="identity">'+icon('bag')+title+'</div>'+mobileTools+'<div class="actions"><button>'+icon('practice')+'Practice</button><button class="primary">'+icon('learn')+'Learn 12</button></div>'+mobilePrefs+'</div></article></section>';const studies=[
 ['Cover and action bar','jacket','<div class="cover"><div class="frame">'+icon('bag').replace('<svg ','<svg class="deck-symbol" ')+title+deckTools+'</div></div><div class="frame line">'+actions+''+prefs+'</div>'],
 ['Bookplate and action column','catalog','<div class="frame"><div class="identity"><div class="book">'+icon('bag')+'</div>'+title+'</div>'+actions+'<div class="meta">'+category+daily+manage+'</div></div>']
];
const desktop=studies.map(([name,style,content])=>'<section><h2>'+name+'</h2><article><div class="'+style+'">'+content+'</div></article></section>').join('');
const preview=document.querySelector('#studies');
const names=['Category tag','Settings strip','Paired fields'];
const categories=['Everyday life','Travel','No category'];
let variant=0,phone=true,choice=categories[0],included=true;
Object.assign(paths,{tag:'M3 3h9l9 9-9 9-9-9z M7 7h.1',down:'m6 9 6 6 6-6'});
const variants=document.querySelector('.variants'),dialog=document.querySelector('dialog');
function render(){
 document.querySelector('main').classList.toggle('phone',phone);
 variants.innerHTML=names.map((name,i)=>'<button data-index="'+i+'" aria-pressed="'+(i===variant)+'">'+name+'</button>').join('');
 const check='<input type="checkbox" aria-label="Daily learning" '+(included?'checked':'')+'>';
 const cat=variant===2?'<small>Category</small><span>'+choice+icon('down')+'</span>':icon('tag')+choice+icon('down');
 const setting=variant===2?'<small>Daily learning</small><span>'+check+(included?'Included':'Excluded')+'</span>':check+'Daily learning';
 const options='<div class="options '+['tag','strip','tabs'][variant]+'"><button aria-label="Change category: '+choice+'" aria-haspopup="dialog">'+cat+'</button><label>'+setting+'</label></div>';
 preview.innerHTML=phone?mobile.replace(mobilePrefs,options):desktop.replace(prefs,options);
 for(const b of document.querySelectorAll('.mode button')) b.setAttribute('aria-pressed',(b.textContent==='Phone')===phone);
}
variants.onclick=e=>{if(e.target.matches('button')){variant=Number(e.target.dataset.index);render();variants.children[variant].focus()}};
preview.onclick=e=>{if(e.target.closest('.options button')){
 const form=dialog.querySelector('form');
 form.querySelectorAll(':scope > button').forEach(b=>b.remove());
 for(const c of categories){const b=document.createElement('button');b.value=c;b.textContent=c+(c===choice?' ✓':'');form.append(b)}
 dialog.returnValue='';dialog.showModal();
}};
dialog.onclose=()=>{if(categories.includes(dialog.returnValue)){choice=dialog.returnValue;render();preview.querySelector('.options button').focus()}};
preview.onchange=e=>{if(e.target.matches('.options input')){included=e.target.checked;if(variant===2)e.target.nextSibling.textContent=included?'Included':'Excluded'}};
for(const b of document.querySelectorAll('.mode button')) b.onclick=()=>{phone=b.textContent==='Phone';render()};
render();
</script></html>
