<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="listening-session">
  <div class="listening-header">
    <span class="listening-kicker">DESKTOP - 02 SESSION - CHROME REMOVED</span>
    <span class="listening-subtitle">LISTENING DRILL - NO NAV, ONE HAIRLINE OF PROGRESS</span>
  </div>

  <div class="listening-panel" data-screen-label="1b Session">
    <div class="listening-progress"><div class="listening-progress-bar"></div></div>

    <div class="listening-surface">
      <div class="listening-prompt">
        <span class="listening-label">LISTEN - WHICH WORD DID YOU HEAR?</span>

        <div class="listening-button-ring" aria-label="Play word audio">
          <span class="listening-play-icon">&gt;</span>
          <div class="listening-ring outer"></div>
          <div class="listening-ring inner"></div>
        </div>

        <div class="listening-wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <span class="listening-helper">SPACE REPLAY - SLOW SHIFT+SPACE</span>
      </div>

      <div class="listening-grid">
        <div class="listening-option">
          <span class="listening-option-number">1</span>
          <span class="listening-option-word">la cuchara</span>
          <span class="listening-option-translation">spoon</span>
        </div>

        <div class="listening-option is-selected">
          <span class="listening-option-number">2</span>
          <span class="listening-option-word">la cucharada</span>
          <span class="listening-option-translation">spoonful</span>
        </div>

        <div class="listening-option">
          <span class="listening-option-number">3</span>
          <span class="listening-option-word">el cuchillo</span>
          <span class="listening-option-translation">knife</span>
        </div>

        <div class="listening-option">
          <span class="listening-option-number">4</span>
          <span class="listening-option-word">la cuchilla</span>
          <span class="listening-option-translation">blade</span>
        </div>
      </div>

      <div class="listening-footer">
        <span class="action">1-4 SELECT</span>
        <span class="action">RETURN CONFIRM</span>
        <span class="action unknown">I DON'T KNOW - DEMOTE TO BOX 01</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
