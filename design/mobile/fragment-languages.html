<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Languages</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Languages</span>
    </header>

    <div class="phone-content" style="gap:0">

      <div style="display:flex;flex-direction:column;border:1px solid var(--wf-line);border-radius:2px;overflow:hidden">
        <!-- In use -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--wf-line)">
          <span style="font-size:15px">French</span>
          <span style="font-size:13px;color:var(--wf-mid)">in use</span>
        </div>

        <!-- Available -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--wf-line)">
          <span style="font-size:15px">Spanish</span>
          <button class="btn" style="height:44px;padding:0 12px;font-size:12px">Use</button>
        </div>

        <!-- Downloading -->
        <div style="display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--wf-line)">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:15px">English</span>
            <span style="font-size:13px;color:var(--wf-mid)">18 of 34 MB</span>
          </div>
          <div style="height:4px;border-radius:3px;background:var(--wf-faint);overflow:hidden">
            <div style="height:100%;width:53%;background:var(--wf-ink);border-radius:2px"></div>
          </div>
        </div>

        <!-- Waiting -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--wf-line)">
          <span style="font-size:15px">German</span>
          <span style="font-size:13px;color:var(--wf-mid)">waiting</span>
        </div>

        <!-- Download available -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--wf-line)">
          <span style="font-size:15px">Italian</span>
          <button class="btn" style="height:44px;padding:0 12px;font-size:12px">Download 27 MB</button>
        </div>

        <!-- Needs update -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px">
          <span style="font-size:15px">Ukrainian</span>
          <span style="font-size:13px;color:var(--wf-mid)">needs newer Ikonika</span>
        </div>
      </div>

      <div style="padding-top:16px">
        <button class="btn ghost" style="width:100%;height:44px">Install from a file</button>
      </div>

    </div>

  </div>
</body>
</html>
