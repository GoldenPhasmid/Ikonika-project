<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Session summary</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Mercado y comida · Train</span>
    </header>

    <div class="phone-content" style="gap:20px;flex:1;justify-content:center;align-items:center;padding-bottom:80px">

      <!-- All segments done -->
      <div style="display:flex;gap:4px;width:100%;max-width:360px">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
      </div>

      <!-- Completion message -->
      <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="font-size:28px;font-weight:500">Training complete</div>
        <span style="font-size:15px;color:var(--wf-mid)">25 words in 3:07</span>
      </div>

      <!-- Stats -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px">
        <div style="background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:16px;text-align:center">
          <div style="font-size:28px;font-weight:500">25</div>
          <div style="font-size:13px;color:var(--wf-mid);margin-top:4px">words trained</div>
        </div>
        <div style="background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:16px;text-align:center">
          <div style="font-size:28px;font-weight:500">3:07</div>
          <div style="font-size:13px;color:var(--wf-mid);margin-top:4px">elapsed</div>
        </div>
      </div>

      <button class="btn primary" style="width:100%;max-width:360px;height:48px;font-size:15px">Done</button>

    </div>

  </div>
</body>
</html>
