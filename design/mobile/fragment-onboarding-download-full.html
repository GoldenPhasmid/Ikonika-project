<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Setup · Download · All three</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <span class="title">Ikonika</span>
    </header>

    <div class="phone-content" style="gap:24px;justify-content:center;align-items:center">

      <!-- Step progress -->
      <div style="display:flex;gap:6px;justify-content:center">
        <div style="width:32px;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="width:32px;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="width:32px;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
      </div>

      <div style="font-size:28px;font-weight:500;letter-spacing:-0.02em;line-height:1.2;text-align:center">Downloading French</div>

      <div class="setup-list" style="width:100%;max-width:320px">
        <div class="setup-row">
          <span class="name">Dictionary</span>
          <span class="track"><i style="width:64%"></i></span>
          <span class="size">16 of 25 MB</span>
        </div>
        <div class="setup-row waiting">
          <span class="name">Voice</span>
          <span class="track"><i style="width:0"></i></span>
          <span class="size">waiting</span>
        </div>
        <div class="setup-row waiting">
          <span class="name">Sentence translation</span>
          <span class="track"><i style="width:0"></i></span>
          <span class="size">waiting</span>
        </div>
      </div>

      <button class="btn primary action disabled" style="width:100%;max-width:320px">Start learning</button>

    </div>

  </div>
</body>
</html>
