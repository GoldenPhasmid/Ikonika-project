<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Create deck</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Create deck</span>
    </header>

    <div class="phone-content" style="gap:20px;flex:1">

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Deck name</span>
        <input type="text" placeholder="e.g. Market and food" style="width:100%;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:15px;background:var(--wf-panel);outline:none">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Description <span style="text-transform:none;letter-spacing:0">(optional)</span></span>
        <textarea placeholder="What is this deck about?" style="width:100%;height:100px;border:1px solid var(--wf-line);border-radius:2px;padding:12px 16px;font-size:15px;background:var(--wf-panel);outline:none;resize:none;font-family:inherit"></textarea>
      </div>

      <div style="flex:1"></div>

      <button class="btn primary" style="width:100%;height:48px;font-size:15px">Create</button>

    </div>

  </div>
</body>
</html>
