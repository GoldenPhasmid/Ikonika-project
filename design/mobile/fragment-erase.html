<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Erase everything</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Erase everything</span>
    </header>

    <div class="phone-content" style="gap:20px">

      <div style="font-size:15px;color:var(--wf-mid);line-height:1.6">
        Deletes every deck, word and day of history on this device and the cloud
        copy in Google Drive. Other devices lose it on their next sync. This
        cannot be undone.
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Type ERASE to confirm</span>
        <input type="text" placeholder="ERASE" style="width:100%;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:16px;text-align:center;background:var(--wf-panel);outline:none">
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;padding-top:8px">
        <button class="btn primary disabled" style="width:100%;height:48px;font-size:15px">Erase everything</button>
        <button class="btn ghost" style="width:100%;height:48px;font-size:15px">Cancel</button>
      </div>

    </div>

  </div>
</body>
</html>
