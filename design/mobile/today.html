<style>
:root {
  --stage: #d9d4c6; --stage-ink: #2e2a25; --stage-muted: #75716a; --stage-line: #c4beae; --stage-panel: #e9e6dd;
  --ui: "Inter", "Segoe UI", sans-serif;
  --display: "Geologica", "Inter", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --stage: #171716; --stage-ink: #f2f0e9; --stage-muted: #9c9a8f; --stage-line: #3a3937; --stage-panel: #222220; color-scheme: dark }
}
:root[data-theme="dark"] { --stage: #171716; --stage-ink: #f2f0e9; --stage-muted: #9c9a8f; --stage-line: #3a3937; --stage-panel: #222220; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--stage); color: var(--stage-ink); font-family: var(--ui) }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent }

.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; justify-items: center }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center }
.seg { display: inline-flex; border: 1px solid var(--stage-line); border-radius: 8px; overflow: hidden; background: var(--stage-panel) }
.seg button { font: 500 13px var(--ui); color: var(--stage-muted); padding: 8px 13px }
.seg button + button { border-left: 1px solid var(--stage-line) }
.seg button[aria-pressed="true"] { color: var(--stage-ink); background: var(--stage-line) }
.seg button:focus-visible { outline: 2px solid #5b9cf8; outline-offset: -2px }

.frame {
  --text: #f2f0e9; --muted: #9c9a8f; --accent: #5b9cf8; --correct: #4caf7d; --page: #262624; --card: #30302e;
  --faint: #363633; --border: #3a3937; --panel: #262624;
  --review: #5b9cf8; --review-ink: #0b1a33; --review-deep: #4a89e2;
  --learn: #4caf7d; --learn-ink: #06251a; --learn-deep: #429d6f;
  --edge: rgba(255, 255, 255, .16); --lift: rgba(0, 0, 0, .34);
}
.frame[data-t="light"] {
  --text: #2e2a25; --muted: #75716a; --accent: #3d63b0; --correct: #3b7a53; --page: #e4e1d7; --card: #efede5;
  --faint: #d6d2c5; --border: #cbc6b8; --panel: #efede5;
  --review: #86aef2; --review-ink: #10244c; --review-deep: #749ee6;
  --learn: #7fc79d; --learn-ink: #0c3320; --learn-deep: #6fb98e;
  --edge: rgba(255, 255, 255, .4); --lift: rgba(74, 56, 34, .2);
}
.frame {
  --review-h: 186px; --learn-h: 96px; --lap: 28px; --tile: 96px; --cover: 174px; --pet: 138px; --count: 108px; --gap: 20px; --header: 72px;
  --ease: cubic-bezier(.2, .85, .25, 1);
  position: relative; display: flex; flex-direction: column; flex: none; overflow: hidden;
  border-radius: 34px; background: var(--page); color: var(--text);
  box-shadow: 0 0 0 1px var(--border), 0 34px 70px -28px rgba(0, 0, 0, .6);
  font-variant-numeric: tabular-nums;
}
.frame[data-size="small"] { --review-h: 142px; --learn-h: 80px; --lap: 24px; --tile: 80px; --cover: 134px; --pet: 102px; --count: 80px; --gap: 16px; --header: 60px }

.header { height: var(--header); flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px }
.header strong { font-size: 18px; font-weight: 600 }
.header span { display: flex }
.header button { width: 44px; height: 44px; display: grid; place-items: center }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round }

.strip { --cell: 48px; --mark: 30px; --today: 68px; flex: none; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: var(--gap) }
.strip::-webkit-scrollbar { display: none }
.days { position: relative; display: flex; align-items: flex-start; width: max-content }
.day { width: var(--cell); display: grid; justify-items: center; row-gap: 6px; scroll-snap-align: center }
.day.today { width: calc(var(--today) + 20px) }
.name { height: 14px; font-size: 12px; line-height: 14px; font-weight: 500; color: var(--muted) }
.today .name { color: var(--text); font-weight: 700 }
.mark { width: var(--mark); height: var(--mark) }
.today .mark { width: var(--today); height: var(--today) }
.mark svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg) }
.mark circle { fill: none }
.due {
  --heat: 0;
  width: var(--mark); height: var(--mark); border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
  border: 1.5px solid color-mix(in srgb, var(--accent) 75%, transparent);
  background: color-mix(in srgb, var(--accent) calc(6% + var(--heat) * 34%), var(--page));
}
.due.zero, .missed { border: 1.5px dashed var(--border); background: none; color: var(--muted); font-weight: 500 }
.missed { display: block; width: 100%; height: 100%; border-radius: 50% }

.sheets { flex: 1; min-height: 0; display: flex; flex-direction: column }
.sheet { position: relative; flex: none; display: block; width: 100%; border-radius: var(--lap) var(--lap) 0 0; box-shadow: 0 -10px 24px -8px var(--lift), inset 0 1px 0 var(--edge) }
.sheet + .sheet { margin-top: calc(-1 * var(--lap)) }
.band { overflow: hidden; transition: filter 140ms }
.band:active { filter: brightness(.94) }
.band:focus-visible { outline: 3px solid var(--text); outline-offset: -5px }
.band::before {
  content: ""; position: absolute; inset: 0; background: var(--deep);
  clip-path: polygon(46% 100%, 74% 100%, 100% 34%, 100% -28%);
}
.band > * { position: relative }
.label { font-family: var(--display); font-variation-settings: "SHRP" 100; font-weight: 650; font-size: 22px; line-height: 1; letter-spacing: -.02em }
.count { font-family: var(--display); font-variation-settings: "SHRP" 100; font-weight: 800; line-height: .8; letter-spacing: -.055em }

.review { --deep: var(--review-deep); height: calc(var(--review-h) + var(--lap)); background: var(--review); color: var(--review-ink); padding: 24px 20px 0 }
.review .label { position: absolute; left: 20px; top: 24px }
.review .count { position: absolute; left: 16px; bottom: calc(var(--lap) + 20px); font-size: var(--count) }
.lufi { position: absolute; right: 8px; bottom: var(--lap); height: var(--pet); aspect-ratio: 535 / 675 }
.lufi svg { display: block; width: 100%; height: 100%; overflow: hidden }

.learn { --deep: var(--learn-deep); height: calc(var(--learn-h) + var(--lap)); background: var(--learn); color: var(--learn-ink); padding: 0 24px var(--lap) 20px }
.learn .row { display: flex; align-items: center; justify-content: space-between; height: 100% }
.learn .count { font-size: calc(var(--count) * .52) }

.base { flex: 1; background: var(--page); padding-top: var(--gap); box-shadow: 0 -10px 24px -8px var(--lift), inset 0 1px 0 color-mix(in srgb, var(--text) 9%, transparent) }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px }
.tile {
  height: var(--tile); border-radius: 14px; background: var(--card); padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
  font-size: 15px; font-weight: 600; transition: transform 140ms var(--ease);
}
.tile:active, .book:active { transform: scale(.96) }
.tile:focus-visible, .book:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.frame[data-size="small"] .tile { padding: 12px; font-size: 14px }

h2 { margin: var(--gap) 16px 10px; font: 600 15px/20px var(--ui) }
.shelf { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory; scroll-padding: 16px; scrollbar-width: none }
.shelf::-webkit-scrollbar { display: none }
.book {
  position: relative; flex: none; height: var(--cover); aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; scroll-snap-align: start;
  background: var(--paper); color: var(--ink); container-type: inline-size; transition: transform 140ms var(--ease);
}
.book::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 12px; background: linear-gradient(90deg, rgba(0, 0, 0, .32), rgba(0, 0, 0, .06) 45%, transparent) }
.plate { position: absolute; inset: 6.5cqw; border: 1px solid var(--foil); padding: 16cqw 6.5cqw; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center }
.plate small { font-size: 7cqw; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .85 }
.plate b { align-self: center; font-size: 12cqw; line-height: 1.2; font-weight: 600 }
.plate i { width: 16cqw; height: 1px; background: var(--foil) }

.tabs { position: relative; height: 82px; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 12px 4px; background: var(--panel); border-top: 1px solid var(--border) }
.tab { display: grid; justify-items: center; align-content: center; gap: 6px; font-size: 10px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase; color: var(--muted) }
.tab span { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); display: grid; place-items: center; color: var(--text) }
.tab .icon { width: 20px; height: 20px }
.frame[data-size="small"] .tab { font-size: 9px; letter-spacing: .2px }
.tab.on { color: var(--text); font-weight: 600 }
.tab.on span { background: var(--text); color: var(--panel); border-color: transparent }

.done { width: .74em; height: .74em; display: block; fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: square; stroke-linejoin: miter }

@media (prefers-reduced-motion: no-preference) {
  .play .sheet { animation: rise 620ms var(--ease) backwards }
  .play .learn { animation-delay: 70ms }
  .play .base { animation-delay: 140ms }
  .play .lufi { animation: peek 620ms var(--ease) 520ms backwards }
  .play .arc { animation: draw 1000ms var(--ease) var(--delay, 0ms) backwards }
  .eyes { transform-box: view-box; transform-origin: 338px 263px; animation: blink 5.2s 2.4s infinite }
}
@keyframes rise { from { transform: translateY(160px); opacity: 0 } }
@keyframes peek { from { transform: translateY(105%) } }
@keyframes draw { from { stroke-dashoffset: var(--length) } }
@keyframes blink { 0%, 3.4%, 100% { transform: scaleY(1) } 1.6% { transform: scaleY(.06) } }
</style>

<script>
const GOAL = 15;
const TODAY = new Date(2026, 10, 12);
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const PAST = [{ review: 1, learned: 15 }, { review: 0, learned: 0 }, { review: 1, learned: 9 }, { review: 1, learned: 15 },
              { review: .6, learned: 15 }, { review: 1, learned: 12 }, { review: 1, learned: 15 }];
const COMING = [20, 29, 0, 41, 8, 0, 12];
const BOOKS = [['Voltaire', 'Candide'], ['Gustave Flaubert', 'Madame Bovary'], ['Jules Verne', 'Vingt mille lieues sous les mers'],
               ['Guy de Maupassant', 'Le Horla'], ['Émile Zola', 'Germinal']];
const COVERS = [['#1f3f66', '#bcc8d6', '#eef2f7'], ['#6b2a2a', '#d9b26f', '#f3e6d6'], ['#2f4a35', '#d39a6a', '#f1e9d6'], ['#4b2e4f', '#e2b3a3', '#f6ebee']];
const STATES = { morning: { learned: 0, due: 76, reviewed: 0 }, done: { learned: 15, due: 0, reviewed: 76 } };
const SIZES = { small: [360, 760], medium: [412, 915] };
const CHECK = '<svg class="done" viewBox="0 0 24 24" role="img" aria-label="Done"><path d="M3 13l6 6L21 5"/></svg>';

const view = { state: 'morning', size: 'medium', theme: 'dark' };
try { Object.assign(view, JSON.parse(localStorage.getItem('today-mobile') || '{}')) } catch (e) {}
for (const [key, value] of new URLSearchParams(location.search)) view[key] = value;

const $ = id => document.getElementById(id);

function ring(size, stroke, gap, outer, inner, delay) {
  const arc = (radius, ratio, colour, offset) => {
    const length = 2 * Math.PI * radius;
    const shape = `cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${stroke}"`;
    return `<circle ${shape} stroke="var(--faint)"/>` + (ratio > 0
      ? `<circle class="arc" style="--length:${length};--delay:${delay + offset}ms" ${shape} stroke="${colour}" stroke-linecap="round"
          stroke-dasharray="${length}" stroke-dashoffset="${length * (1 - Math.min(ratio, 1))}"/>` : '');
  };
  const radius = (size - stroke) / 2;
  return `<svg viewBox="0 0 ${size} ${size}">${arc(radius, outer, 'var(--accent)', 0)}${arc(radius - stroke - gap, inner, 'var(--correct)', 140)}</svg>`;
}

function dayName(offset) {
  const date = new Date(TODAY);
  date.setDate(date.getDate() + offset);
  return WEEKDAYS[date.getDay()];
}

function day(offset, mark) {
  return `<div class="day ${offset === 0 ? 'today' : ''}"><div class="name">${dayName(offset)}</div><div class="mark">${mark}</div></div>`;
}

function fit() {
  const frame = $('frame');
  frame.style.zoom = Math.min(1, frame.parentElement.clientWidth / SIZES[view.size][0]);
}

function render() {
  const state = STATES[view.state];
  const frame = $('frame');
  frame.dataset.t = view.theme;
  frame.dataset.size = view.size;
  [frame.style.width, frame.style.height] = SIZES[view.size].map(value => value + 'px');
  fit();

  const total = state.reviewed + state.due;
  const busiest = Math.max(...COMING, 1);
  $('days').innerHTML = [
    ...PAST.map((entry, index) => day(index - PAST.length, entry.review || entry.learned ? ring(30, 3, 2, entry.review, entry.learned / GOAL, 0) : '<span class="missed"></span>')),
    day(0, ring(68, 6, 3, total ? state.reviewed / total : 1, state.learned / GOAL, 80)),
    ...COMING.map((count, index) => day(index + 1, `<div class="due ${count ? '' : 'zero'}" style="--heat:${count / busiest}">${count}</div>`))
  ].join('');

  $('review').innerHTML = state.due || CHECK;
  $('learn').innerHTML = GOAL - state.learned || CHECK;
  $('shelf').innerHTML = BOOKS.map(([author, title], index) => {
    const [paper, foil, ink] = COVERS[index % COVERS.length];
    return `<button class="book" aria-label="${title}" style="--paper:${paper};--foil:${foil};--ink:${ink}"><span class="plate"><small>${author}</small><b>${title}</b><i></i></span></button>`;
  }).join('');

  const strip = $('strip');
  const today = strip.querySelector('.today');
  strip.scrollLeft = today.offsetLeft + today.offsetWidth / 2 - strip.clientWidth / 2;

  for (const seg of document.querySelectorAll('.seg'))
    for (const button of seg.children) button.setAttribute('aria-pressed', button.dataset.v === view[seg.dataset.key]);
  try { localStorage.setItem('today-mobile', JSON.stringify(view)) } catch (e) {}
}

for (const seg of document.querySelectorAll('.seg'))
  seg.addEventListener('click', event => {
    if (!event.target.dataset.v) return;
    view[seg.dataset.key] = event.target.dataset.v;
    render();
  });
addEventListener('resize', fit);
render();
</script>
