<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Dictionary not found</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Dictionary</span>
    </header>

    <div class="phone-content" style="gap:16px">

      <!-- Search -->
      <div style="display:flex;gap:8px">
        <input type="text" value="marché ferme" style="flex:1;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:15px;background:var(--wf-panel);outline:none">
        <button class="btn primary" style="height:44px;padding:0 16px">Search</button>
      </div>

      <!-- No results -->
      <div style="background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
        <div style="font-size:20px;font-weight:500">No results</div>

        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:12px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Machine translation</span>
          <span style="font-size:16px">closed market</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;width:100%;padding-top:8px">
          <button class="btn" style="width:100%;height:44px">Add manually</button>
          <button class="btn" style="width:100%;height:44px">Add with translation</button>
          <button class="btn primary" style="width:100%;height:44px">Search the web</button>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
