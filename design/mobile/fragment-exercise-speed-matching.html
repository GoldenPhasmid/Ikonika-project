<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Speed matching</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
  <style>
    .ex-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 16px;
      line-height: 1;
    }
    .match-card {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 16px;
      min-height: 100px;
      font-size: 16px;
      line-height: 1.35;
      cursor: pointer;
    }
    .match-card.source {
      background: var(--wf-learning);
      color: var(--wf-paper);
      border: 1px solid var(--wf-learning);
    }
    .match-card.target {
      background: var(--wf-faint);
      border: 1px solid var(--wf-line);
    }
  </style>
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Match a pair</span>
      <div style="display:flex;gap:4px">
        <button class="icon-btn bare" title="Mute"><span class="ex-icon">🔇</span></button>
        <button class="icon-btn bare" title="Ask side"><span class="ex-icon">🔄</span></button>
      </div>
    </header>

    <div class="phone-content" style="gap:0;flex:1">

      <!-- Stage segments (10 segments for single exercise) -->
      <div style="display:flex;gap:6px;padding:0 16px;margin-bottom:12px">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
      </div>

      <!-- 2x5 match grid card filling remaining space -->
      <div style="flex:1;display:flex;flex-direction:column;background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:32px 24px;position:relative">
        <!-- Top-left session-ticks (10 ticks for 10 questions) -->
        <div style="position:absolute;top:16px;left:20px">
          <span class="session-ticks" style="width:100%;max-width:200px">
            <i class="right"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </div>

        <!-- 2x5 match grid -->
        <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;align-content:center">
          <div class="match-card source">pang</div>
          <div class="match-card target">swindle or cheat out money</div>
          <div class="match-card source">gimcrack</div>
          <div class="match-card target">sudden sharp pain</div>
          <div class="match-card source">fleece</div>
          <div class="match-card target">(noun) courage and determination in diff situations</div>
          <div class="match-card source">contrition</div>
          <div class="match-card target">(adj) showy thing or a poor quality</div>
          <div class="match-card source">mettle</div>
          <div class="match-card target">sincere remorse or regret for past actions</div>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
