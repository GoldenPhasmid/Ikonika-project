<title>Ikonika Mobile Today Layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --page: #e4e1d7; --page-ink: #2e2a25; --page-muted: #75716a; --page-line: #d6d2c5; --page-panel: #efede5;
  --font: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #1d1d1b; --page-ink: #f2f0e9; --page-muted: #9c9a8f; --page-line: #3a3937; --page-panel: #262624; color-scheme: dark } }

.frame {
  --text: #f2f0e9; --muted: #9c9a8f; --accent: #5b9cf8; --panel: #262624; --faint: #30302e; --sunken: #2b2b29;
  --subtle: #c2c0b6; --outline: #8a887e; --border: #3a3937; --correct: #4caf7d;
}
.frame[data-t="light"] {
  --text: #2e2a25; --muted: #75716a; --accent: #3d63b0; --panel: #efede5; --faint: #e4e1d7; --sunken: #e9e6dd;
  --subtle: #57534b; --outline: #857f72; --border: #d6d2c5; --correct: #3b7a53;
}

* { box-sizing: border-box }
body {
  background: var(--page); color: var(--page-ink); font-family: var(--font); margin: 0;
  padding: 28px 16px 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; justify-items: center }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: center }
.seg { display: inline-flex; border: 1px solid var(--page-line); border-radius: 8px; overflow: hidden; background: var(--page-panel) }
.seg button { font: 500 13px var(--font); color: var(--page-muted); background: none; border: 0; padding: 8px 13px; cursor: pointer }
.seg button + button { border-left: 1px solid var(--page-line) }
.seg button[aria-pressed="true"] { color: var(--page-ink); background: var(--page-line) }
.seg button:focus-visible { outline: 2px solid #5b9cf8; outline-offset: -2px }
.ctl-label { font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--page-muted); margin-right: 8px }

.frame {
  display: flex; flex-direction: column; flex: none;
  background: var(--sunken); color: var(--text); border-radius: 28px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--border), 0 24px 60px -20px rgba(0,0,0,.45);
  font-family: var(--font); font-variant-numeric: tabular-nums;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
.topbar { height: 72px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px }
.topbar .box { height: 32px }
.topbar .title { width: 80px }
.topbar .icons { display: flex; gap: 12px }
.topbar .icons .box { width: 32px }
.navbar { height: 80px; flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border) }

.content { flex: 1; min-height: 0; display: flex; flex-direction: column; row-gap: 16px; padding-bottom: 16px }

.box {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 10px; background: var(--faint);
  color: var(--muted); font-size: 12px; font-weight: 600; padding: 6px; min-height: 0;
}
.box small { display: block; font-weight: 400; font-size: 11px; opacity: .8; margin-top: 2px }

.strip {
  --cell: 48px; --mark: 30px; --today: 68px; --name: 14px; --name-gap: 4px;
  position: relative; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; flex: none;
}
.strip::-webkit-scrollbar { display: none }
.days { display: flex; align-items: flex-start; width: max-content }
.day { width: var(--cell); display: grid; justify-items: center; row-gap: var(--name-gap); scroll-snap-align: center }
.day.today { width: calc(var(--today) + 20px) }
.name { height: var(--name); line-height: var(--name); font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap }
.day.today .name { color: var(--text); font-weight: 700 }
.slot { display: grid; place-items: center }
.day.today .slot { height: var(--today) }
.mark { width: var(--mark); height: var(--mark); position: relative }
.day.today .mark { width: var(--today); height: var(--today) }
.mark svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.due {
  --heat: 0;
  width: var(--mark); height: var(--mark); border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid color-mix(in srgb, var(--accent) 75%, transparent);
  background: color-mix(in srgb, var(--accent) calc(6% + var(--heat) * 34%), var(--sunken));
  font-size: 11px; font-weight: 700; color: var(--text);
}
.due.zero { border: 1.5px dashed var(--border); background: var(--sunken); color: var(--muted); font-weight: 500 }
.missed { width: 100%; height: 100%; border-radius: 50%; border: 1.5px dashed var(--border) }

.frame { --hero: 168px; --row: 68px; --tile: 84px; --cover: 184px; --pet: 132px }
.frame[data-size="small"] { --hero: 140px; --row: 60px; --tile: 72px; --cover: 136px; --pet: 108px }

.primary { background: color-mix(in srgb, var(--text) 16%, var(--faint)); color: var(--text) }
.study { display: grid; row-gap: 8px; padding: 0 16px; flex: none }
.hero {
  position: relative; height: var(--hero); border-radius: 14px; padding: 18px;
  display: grid; align-content: space-between; justify-items: start;
}
.hero .box { background: color-mix(in srgb, var(--sunken) 55%, transparent) }
.hero .label { width: 96px; height: 26px }
.hero .count { width: 132px; height: 52px }
.pet { position: absolute; right: 16px; bottom: 0; height: var(--pet); aspect-ratio: 535 / 704; border-radius: 10px 10px 0 0 }
.study > .box { height: var(--row) }

.exercises { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 8px; height: var(--tile); padding: 0 16px; flex: none }

.reading { display: grid; row-gap: 10px; flex: none }
.reading .label { justify-self: start; margin-left: 16px; height: 20px; padding: 0 10px; font-size: 11px }
.shelf { display: flex; column-gap: 10px; overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory; scroll-padding: 16px; scrollbar-width: none }
.shelf::-webkit-scrollbar { display: none }
.shelf .box { flex: none; height: var(--cover); aspect-ratio: 2 / 3; border-radius: 6px; scroll-snap-align: start }

svg circle { fill: none }
svg .arc { animation: draw 1000ms var(--ease) var(--delay, 0ms) both }
@keyframes draw { from { stroke-dashoffset: var(--length) } }
@media (prefers-reduced-motion: reduce) { svg .arc { animation: none } }
</style>

<div class="wrap">
  <div class="controls">
    <div><span class="ctl-label">State</span><span class="seg" id="seg-state">
      <button data-v="morning">Morning</button><button data-v="done">Goal reached</button>
    </span></div>
    <div><span class="ctl-label">Phone</span><span class="seg" id="seg-size">
      <button data-v="small">360 &times; 760</button><button data-v="medium">412 &times; 915</button>
    </span></div>
    <div><span class="ctl-label">Theme</span><span class="seg" id="seg-theme">
      <button data-v="dark">Dark</button><button data-v="light">Light</button>
    </span></div>
  </div>

  <div class="frame" id="frame" data-t="dark">
    <div class="topbar">
      <div class="box title">Language</div>
      <div class="icons"><div class="box"></div><div class="box"></div></div>
    </div>

    <div class="content">
      <div class="strip" id="strip"><div class="days" id="days"></div></div>

      <div class="study">
        <div class="hero primary">
          <div class="box label">Review</div>
          <div class="box count">due count</div>
          <div class="box pet">Cat</div>
        </div>
        <div class="box primary">Learn new words</div>
      </div>

      <div class="exercises">
        <div class="box">Discover</div>
        <div class="box">Sentences</div>
        <div class="box">Practice</div>
      </div>

      <div class="reading">
        <div class="box label">Continue reading</div>
        <div class="shelf">
          <div class="box">Cover</div><div class="box">Cover</div><div class="box">Cover</div><div class="box">Cover</div><div class="box">Cover</div>
        </div>
      </div>
    </div>

    <div class="navbar">
      <div class="box">Today</div><div class="box">Words</div><div class="box">Reader</div><div class="box">Decks</div><div class="box">Vocab</div>
    </div>
  </div>
</div>

<script>
const GOAL = 15;
const TODAY = new Date(2026, 10, 12);
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const PAST = [{ review: 1, learned: 15 }, { review: 0, learned: 0 }, { review: 1, learned: 9 }, { review: 1, learned: 15 },
              { review: .6, learned: 15 }, { review: 1, learned: 12 }, { review: 1, learned: 15 }];
const COMING = [20, 29, 0, 41, 8, 0, 12];

const STATES = {
  morning: { learned: 0, reviewDue: 76, reviewed: 0 },
  done: { learned: 15, reviewDue: 0, reviewed: 76 }
};

const SIZES = { small: { w: 360, h: 760 }, medium: { w: 412, h: 915 } };

let view = { state: 'morning', size: 'medium', theme: (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') };
try { Object.assign(view, JSON.parse(localStorage.getItem('today-layout-mobile') || '{}')) } catch (e) {}

const $ = id => document.getElementById(id);

function ringSvg(size, stroke, gap, outer, inner, delay) {
  const rOuter = (size - stroke) / 2;
  const rInner = rOuter - stroke - gap;
  const arc = (r, p, colour, offset) => {
    const length = 2 * Math.PI * r;
    const ratio = Math.min(Math.max(p, 0), 1);
    return `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--faint)" stroke-width="${stroke}"/>` +
      (ratio > 0 ? `<circle class="arc" style="--length:${length};--delay:${delay + offset}ms" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${colour}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${length}" stroke-dashoffset="${length * (1 - ratio)}"/>` : '');
  };
  return `<svg viewBox="0 0 ${size} ${size}">${arc(rOuter, outer, 'var(--accent)', 0)}${arc(rInner, inner, 'var(--correct)', 140)}</svg>`;
}

function dayName(offset) {
  const date = new Date(TODAY);
  date.setDate(date.getDate() + offset);
  return WEEKDAYS[date.getDay()];
}

function render() {
  const s = STATES[view.state];
  const z = SIZES[view.size];
  const frame = $('frame');
  frame.dataset.t = view.theme;
  frame.dataset.size = view.size;
  frame.style.width = z.w + 'px';
  frame.style.height = z.h + 'px';

  const reviewTotal = s.reviewed + s.reviewDue;
  const reviewRatio = reviewTotal > 0 ? s.reviewed / reviewTotal : 1;
  const goalRatio = Math.min(s.learned / GOAL, 1);
  const busiest = Math.max(...COMING, 1);

  const past = PAST.map((day, index) => {
    const offset = index - PAST.length;
    const mark = day.review === 0 && day.learned === 0 ? '<span class="missed"></span>'
                                                       : ringSvg(30, 3, 2, day.review, day.learned / GOAL, 0);
    return `<div class="day"><div class="name">${dayName(offset)}</div><div class="slot"><div class="mark">${mark}</div></div></div>`;
  });

  const today = `<div class="day today" id="today"><div class="name">${dayName(0)}</div>
    <div class="slot"><div class="mark">${ringSvg(68, 6, 3, reviewRatio, goalRatio, 80)}</div></div></div>`;

  const coming = COMING.map((count, index) =>
    `<div class="day"><div class="name">${dayName(index + 1)}</div>
      <div class="slot"><div class="due ${count > 0 ? '' : 'zero'}" style="--heat:${count / busiest}">${count}</div></div></div>`);

  $('days').innerHTML = [...past, today, ...coming].join('');

  const strip = $('strip');
  const todayCell = $('today');
  strip.scrollLeft = todayCell.offsetLeft + todayCell.offsetWidth / 2 - strip.clientWidth / 2;

  for (const [segId, key] of [['seg-state', 'state'], ['seg-size', 'size'], ['seg-theme', 'theme']])
    for (const button of $(segId).querySelectorAll('button')) button.setAttribute('aria-pressed', button.dataset.v === view[key]);

  try { localStorage.setItem('today-layout-mobile', JSON.stringify(view)) } catch (e) {}
}

for (const [segId, key] of [['seg-state', 'state'], ['seg-size', 'size'], ['seg-theme', 'theme']])
  $(segId).addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    view[key] = button.dataset.v;
    render();
  });
document.fonts && document.fonts.ready.then(render);
render();
</script>
