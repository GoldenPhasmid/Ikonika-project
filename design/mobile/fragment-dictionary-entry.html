<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Dictionary · translates to</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Dictionary</span>
    </header>

    <div class="phone-content" style="gap:16px">

      <!-- Search -->
      <div style="display:flex;gap:8px">
        <input type="text" value="market" style="flex:1;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:15px;background:var(--wf-panel);outline:none">
        <button class="btn primary" style="height:44px;padding:0 16px">Search</button>
      </div>

      <!-- Result -->
      <div style="background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:15px">No word "market" — these words translate to it:</div>

        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--wf-faint)">
          <span style="font-size:16px;text-decoration:underline;flex:1">le marché</span>
          <span style="font-size:13px;color:var(--wf-mid)">noun</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">top 1k</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">A1</span>
        </div>

        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--wf-faint)">
          <span style="font-size:16px;flex:1">la place</span>
          <span style="font-size:13px;color:var(--wf-mid)">noun</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">top 1k</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">A2</span>
        </div>

        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--wf-faint)">
          <span style="font-size:16px;flex:1">le débouché</span>
          <span style="font-size:13px;color:var(--wf-mid)">noun</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">top 10k</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">B2</span>
        </div>

        <div style="display:flex;align-items:center;gap:8px;padding:8px 0">
          <span style="font-size:16px;flex:1">commercialiser</span>
          <span style="font-size:13px;color:var(--wf-mid)">verb</span>
          <span style="font-size:11px;background:var(--wf-faint);padding:2px 6px;border-radius:3px">top 10k</span>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
