<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Setup · Another machine</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <span class="title">Ikonika</span>
    </header>

    <div class="phone-content" style="gap:24px">
      <div style="font-size:28px;font-weight:500;letter-spacing:-0.02em;line-height:1.2">Bring your words over</div>

      <div class="setup-list" style="width:100%">
        <div class="setup-row" style="flex-direction:column;align-items:stretch;gap:4px;padding:16px;min-height:auto">
          <span class="path" style="word-break:break-all">/data/user/0/com.ikonika/files/Ikonika.db</span>
        </div>
        <div class="setup-row"><span class="name">Decks</span><span class="size">12</span></div>
        <div class="setup-row"><span class="name">Words</span><span class="size">1,246</span></div>
        <div class="setup-row"><span class="name">Learning</span><span class="size">French from English</span></div>
        <div class="setup-row"><span class="name">Last used</span><span class="size">2 days ago</span></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;width:100%">
        <button class="btn primary action" style="width:100%">Merge into this machine</button>
        <button class="btn ghost" style="width:100%">Choose a different file</button>
      </div>

      <span class="setup-note" style="width:100%">Nothing on this machine is deleted. Both sides are kept.</span>
    </div>

  </div>
</body>
</html>
