<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Triage</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
  <style>
    .ex-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 16px;
      line-height: 1;
    }

    .gesture-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 12px;
      color: var(--wf-mid);
      opacity: 0.6;
      pointer-events: none;
    }

    .gesture-hint span {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .gesture-hint .icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--wf-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .gesture-hint .icon.know {
      background: #e8f5e9;
    }

    .gesture-hint .icon.skip {
      background: #fff8e1;
    }

    .gesture-hint .icon.learn {
      background: #e3f2fd;
    }
  </style>
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">New words</span>
      <button class="icon-btn bare" title="Mute"><span class="ex-icon">🔇</span></button>
    </header>

    <div class="phone-content" style="gap:0;padding:16px;flex:1">

      <!-- Stage segments (from 09a) - OUTSIDE card -->
      <div style="display:flex;gap:6px;width:100%;margin-bottom:12px">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
      </div>

      <!-- Card filling remaining space (from 09a) -->
      <div style="flex:1;display:flex;flex-direction:column;background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:32px 24px;position:relative">
        <!-- Top-right: progress + actions -->
        <div style="position:absolute;top:16px;right:20px;display:flex;gap:8px;align-items:center">
          <span style="font-size:13px;color:var(--wf-mid)">14 / 25</span>
          <button class="icon-btn bare" title="Listen"><span class="ex-icon">🔊</span></button>
          <button class="icon-btn bare" title="Web"><span class="ex-icon">🌐</span></button>
        </div>

        <!-- Top-left session-ticks (from 08g/09b) -->
        <div style="position:absolute;top:16px;left:20px">
          <span class="session-ticks" style="width:50%;max-width:180px">
            <i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i><i class="right"></i>
          </span>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
          <div style="font-size:13px;color:var(--wf-mid)">noun · f</div>
          <div style="font-size:42px;font-weight:500;letter-spacing:-0.01em">la moule</div>

          <input type="text" value="mussel" style="width:100%;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:16px;text-align:center;background:var(--wf-panel);outline:none">

          <!-- Translation chips -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%">
            <span class="chip in-use" style="height:44px;justify-content:center;font-size:13px">mussel</span>
            <span class="chip" style="height:44px;justify-content:center;font-size:13px">shell</span>
            <span class="chip" style="height:44px;justify-content:center;font-size:13px">mould</span>
            <span class="chip" style="height:44px;justify-content:center;font-size:13px">cast</span>
            <span class="chip" style="height:44px;justify-content:center;font-size:13px">tin</span>
            <span class="chip" style="height:44px;justify-content:center;font-size:13px">form</span>
          </div>
        </div>

        <!-- Gesture indicators at bottom center -->
        <div class="gesture-hint">
          <span>
            <div class="icon know">←</div>
            Know
          </span>
          <span>
            <div class="icon skip">↑</div>
            Skip
          </span>
          <span>
            <div class="icon learn">→</div>
            Learn
          </span>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
