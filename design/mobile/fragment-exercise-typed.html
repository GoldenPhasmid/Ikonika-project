<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Typed translation</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
  <style>
    .ex-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 16px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Compile word</span>
      <div style="display:flex;gap:4px">
        <button class="icon-btn bare" title="Mute"><span class="ex-icon">🔇</span></button>
        <button class="icon-btn bare" title="Ask side"><span class="ex-icon">🔄</span></button>
      </div>
    </header>

    <div class="phone-content" style="gap:0;flex:1">

      <!-- Stage segments (10 segments for single exercise) -->
      <div style="display:flex;gap:6px;padding:0 16px;margin-bottom:12px">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-ink)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--wf-faint)"></div>
      </div>

      <!-- Prompt card filling remaining space -->
      <div style="flex:1;display:flex;flex-direction:column;background:var(--wf-panel);border:1px solid var(--wf-line);border-radius:2px;padding:32px 24px;position:relative;margin:0 16px">
        <!-- Top-left session-ticks (10 ticks for 10 questions) -->
        <div style="position:absolute;top:16px;left:20px">
          <span class="session-ticks" style="width:100%;max-width:200px">
            <i class="right"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px">
          <div style="font-size:22px;font-weight:600;text-align:center;line-height:1.4">anxiety or dismay at unexpected</div>
        </div>

        <!-- Don't know link -->
        <div style="text-align:center;padding:12px 0">
          <button class="btn ghost" style="color:var(--wf-learning)">Don't know</button>
        </div>

        <!-- Text input -->
        <div style="width:100%">
          <input class="session-input" type="text" style="width:100%;height:48px;font-size:18px;text-align:center">
        </div>
      </div>

    </div>

  </div>
</body>
</html>
