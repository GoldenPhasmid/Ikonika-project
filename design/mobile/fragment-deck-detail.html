<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Deck detail</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Mercado y comida</span>
      <button class="icon-btn bare" title="Edit words">✎</button>
    </header>

    <div class="phone-content" style="gap:0;padding-bottom:80px">

      <!-- Exercises -->
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wf-panel);border:1px solid var(--wf-line)">
          <span style="font-size:20px">🃏</span>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:500">Flashcard</div>
            <div style="font-size:13px;color:var(--wf-mid)">Swipe through words</div>
          </div>
          <span style="font-size:13px;color:var(--wf-mid)">48</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wf-panel);border:1px solid var(--wf-line)">
          <span style="font-size:20px">🔄</span>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:500">Flip</div>
            <div style="font-size:13px;color:var(--wf-mid)">Guess then reveal</div>
          </div>
          <span style="font-size:13px;color:var(--wf-mid)">48</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wf-panel);border:1px solid var(--wf-line)">
          <span style="font-size:20px">◉</span>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:500">Multiple choice</div>
            <div style="font-size:13px;color:var(--wf-mid)">Pick the right answer</div>
          </div>
          <span style="font-size:13px;color:var(--wf-mid)">48</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wf-panel);border:1px solid var(--wf-line)">
          <span style="font-size:20px">⌨</span>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:500">Typed</div>
            <div style="font-size:13px;color:var(--wf-mid)">Type the translation</div>
          </div>
          <span style="font-size:13px;color:var(--wf-mid)">48</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wf-panel);border:1px solid var(--wf-line)">
          <span style="font-size:20px">🔊</span>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:500">Audio</div>
            <div style="font-size:13px;color:var(--wf-mid)">Listen and type</div>
          </div>
          <span style="font-size:13px;color:var(--wf-mid)">48</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wf-panel);border:1px solid var(--wf-line)">
          <span style="font-size:20px">⚡</span>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:500">Speed matching</div>
            <div style="font-size:13px;color:var(--wf-mid)">Match pairs fast</div>
          </div>
          <span style="font-size:13px;color:var(--wf-mid)">48</span>
        </div>
      </div>

    </div>

    <nav class="phone-tabbar">
      <button class="tab"><span class="tab-icon"></span><span class="label">Today</span></button>
      <button class="tab active"><span class="tab-icon"><span class="badge-dot">12</span></span><span class="label">Decks</span></button>
      <button class="tab"><span class="tab-icon"></span><span class="label">Words</span></button>
      <button class="tab"><span class="tab-icon"></span><span class="label">Settings</span></button>
    </nav>

  </div>
</body>
</html>
