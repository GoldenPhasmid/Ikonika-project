<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Discover</title>
  <!-- Self-contained, unlike the other fragments: it carries real dictionary rows and runs the
       selection model, so it has to open on its own. Tokens are copied from ../v3/wireframe.css. -->
  <style>
    :root {
      --wf-ink: #111;
      --wf-mid: #888;
      --wf-soft: #ccc;
      --wf-faint: #eee;
      --wf-line: #d0d0d0;
      --wf-paper: #fafafa;
      --wf-panel: #ffffff;
      --wf-canvas: #f2f2f2;
      --wf-new: #5b6270;
      --wf-learning: #2f6fe0;
      --wf-done: #2f9563;
      --wf-new-text: #5b6270;
      --wf-learning-text: #2b66d0;
      --wf-done-text: #237a50;
      --wf-font: system-ui, sans-serif;
      --wf-mono: ui-monospace, "Cascadia Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--wf-canvas);
      color: var(--wf-ink);
      font-family: var(--wf-font);
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; color: inherit; }

    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }

    .phone {
      display: flex;
      flex-direction: column;
      width: 412px;
      height: min(915px, calc(100vh - 48px));
      min-height: 680px;
      background: var(--wf-paper);
      border: 1px solid var(--wf-line);
      overflow: hidden;
    }

    .phone-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      flex: none;
      padding: 0 16px;
      border-bottom: 1px solid var(--wf-line);
      background: var(--wf-panel);
    }

    .phone-topbar .title {
      flex: 1;
      font-size: 17px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      flex: none;
      border: 1px solid transparent;
      background: transparent;
      font-size: 19px;
      cursor: pointer;
    }

    .scroll {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      overflow: auto;
    }

    .footer {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--wf-line);
      background: var(--wf-panel);
    }

    .segments { display: flex; gap: 4px; flex: none; }
    .segments i { flex: 1; height: 4px; border-radius: 2px; background: var(--wf-faint); }
    .segments i.done { background: var(--wf-ink); }

    .tray {
      display: flex;
      gap: 6px;
      align-items: center;
      min-height: 26px;
      flex: none;
      overflow-x: auto;
      font-size: 12px;
      color: var(--wf-mid);
      white-space: nowrap;
    }

    .mini {
      padding: 3px 8px;
      border: 1px solid var(--wf-learning);
      border-radius: 2px;
      color: var(--wf-learning-text);
      font-size: 12px;
      white-space: nowrap;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      background: var(--wf-panel);
      border: 1px solid var(--wf-line);
      border-radius: 2px;
    }

    .tag {
      align-self: flex-start;
      padding: 2px 8px;
      border: 1px solid var(--wf-line);
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--wf-mid);
    }

    .meta { font-size: 13px; color: var(--wf-mid); }
    .center { text-align: center; }

    .word {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-align: center;
      line-height: 1.15;
    }

    .prompt-native { font-size: 26px; font-weight: 500; text-align: center; }
    .sentence { font-size: 19px; line-height: 1.45; }
    .sentence mark, .clue mark { background: none; color: inherit; font-weight: 600; border-bottom: 2px solid var(--wf-ink); }
    .sub { font-size: 14px; line-height: 1.4; color: var(--wf-mid); }

    .clue {
      padding: 6px 0 6px 12px;
      border-left: 2px solid var(--wf-soft);
      font-size: 16px;
      line-height: 1.45;
    }

    .options { display: grid; gap: 8px; }

    .opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--wf-line);
      border-radius: 2px;
      background: var(--wf-panel);
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .opt:hover:not(:disabled) { border-color: var(--wf-mid); }
    .opt:disabled { cursor: default; }
    .opt.gone { opacity: 0.3; text-decoration: line-through; }
    .opt.right { border: 2px solid var(--wf-done); color: var(--wf-done-text); }
    .opt.picked { border: 2px solid var(--wf-ink); }
    .opt small { font-size: 12px; color: var(--wf-mid); }

    .reveal {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--wf-line);
    }

    .verdict { font-size: 13px; font-weight: 600; }
    .verdict.known { color: var(--wf-done-text); }
    .verdict.almost, .verdict.new { color: var(--wf-learning-text); }

    .headline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .headline b { font-size: 22px; font-weight: 600; }
    .headline .ph { font-family: var(--wf-mono); font-size: 13px; color: var(--wf-mid); }
    .speak { border: 0; background: none; cursor: pointer; font-size: 16px; padding: 0; }

    .seg3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--wf-line);
      border-radius: 2px;
      overflow: hidden;
    }

    .seg3 button {
      height: 36px;
      border: 0;
      border-left: 1px solid var(--wf-line);
      background: var(--wf-panel);
      font-size: 13px;
      cursor: pointer;
    }

    .seg3 button:first-child { border-left: 0; }
    .seg3 button.on.learn { background: var(--wf-learning); color: #fff; }
    .seg3 button.on.know { background: var(--wf-done); color: #fff; }
    .seg3 button.on.skip { background: var(--wf-new); color: #fff; }
    .seg3.small button { height: 28px; font-size: 12px; }

    .btn {
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--wf-line);
      border-radius: 2px;
      background: var(--wf-panel);
      font-size: 15px;
      cursor: pointer;
    }

    .btn.primary { background: var(--wf-ink); border-color: var(--wf-ink); color: #fff; }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--wf-mid); }

    .section-label {
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--wf-mid);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--wf-panel);
      border: 1px solid var(--wf-line);
      border-radius: 2px;
      cursor: pointer;
    }

    .row .grow { flex: 1; min-width: 0; }
    .row .name { font-size: 16px; }
    .row .line2 { font-size: 13px; color: var(--wf-mid); margin-top: 2px; }
    .check {
      width: 22px; height: 22px; flex: none;
      border: 1px solid var(--wf-mid); border-radius: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .check.on { background: var(--wf-ink); border-color: var(--wf-ink); color: #fff; }

    .bar { height: 4px; background: var(--wf-faint); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .bar i { display: block; height: 100%; background: var(--wf-done); }

    .result {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      background: var(--wf-panel);
      border: 1px solid var(--wf-line);
      border-radius: 2px;
    }

    .result .top { display: flex; align-items: baseline; gap: 8px; }
    .result .top b { font-size: 16px; font-weight: 600; }
    .result .top span { font-size: 14px; color: var(--wf-mid); flex: 1; }
    .result .top em { font-style: normal; font-size: 11px; color: var(--wf-learning-text); white-space: nowrap; }

    .stepper { display: flex; align-items: center; gap: 0; }
    .stepper button { width: 40px; height: 36px; border: 1px solid var(--wf-line); background: var(--wf-panel); cursor: pointer; font-size: 16px; }
    .stepper span { width: 48px; text-align: center; font-size: 16px; }

    .proto {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px dashed var(--wf-mid);
      border-radius: 2px;
      font-size: 13px;
      color: var(--wf-mid);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 6px 10px;
      border: 1px solid var(--wf-line);
      border-radius: 2px;
      background: var(--wf-panel);
      font-size: 13px;
      cursor: pointer;
    }
    .chip.on { background: var(--wf-ink); border-color: var(--wf-ink); color: #fff; }

    .note {
      padding: 10px 12px;
      border: 1px dashed var(--wf-mid);
      font-size: 13px;
      line-height: 1.45;
      color: var(--wf-mid);
    }

    .model {
      width: 300px;
      padding: 14px;
      background: var(--wf-panel);
      border: 1px dashed var(--wf-mid);
      font-family: var(--wf-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #444;
    }

    .model h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--wf-mid); }
    .model .k { color: var(--wf-mid); }
    .model ol { margin: 6px 0 0; padding-left: 20px; }
    .model .curve { display: flex; align-items: flex-end; gap: 1px; height: 40px; margin-top: 6px; }
    .model .curve i { flex: 1; background: var(--wf-soft); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone"></div>
    <aside class="model" id="model"></aside>
  </div>

const PROBE_MIN_WEIGHT = 0.05;

const CONFIRM_BELOW = 0.3;

const H_ASPIRE = new Set(["haricot", "hamburger", "homard", "hachis", "hareng", "houblon", "hors-d’œuvre"]);

const ITEMS = [];
for (const deck of Object.keys(DATA)) {

// ---------- text helpers ----------

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function fold(s) {
  return s.normalize("NFC").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function clean(t) {
  return t.replace(/\s*\(.*?\)\s*/g, " ").replace(/\s+/g, " ").trim();
}

function normT(t) {
  return fold(clean(t)).replace(/^to /, "").trim();
}

function withArticle(item) {
  if (item.pos !== "noun" || item.gender === null || item.gender === undefined) {
    return item.word;
  }
  const first = fold(item.word)[0];
  if ("aeiouy".includes(first) || (first === "h" && !H_ASPIRE.has(item.word))) {
    return "l’" + item.word;
  }
  return (item.gender === 1 ? "la " : "le ") + item.word;
}

function posLabel(item) {
  if (item.pos === "noun") {
    return item.gender === 1 ? "noun · f" : item.gender === 0 ? "noun · m" : "noun";
  }
  return item.pos === "adj" ? "adjective" : item.pos;
}

function findWord(sentence, word) {
  const s = sentence.normalize("NFC");
  const fs = fold(s);
  const fw = fold(word);
  let start = fs.indexOf(fw);
  let length = fw.length;
  if (start >= 0) {
    while (start + length < fs.length && /[a-z]/.test(fs[start + length])) {
      length++;
    }
    return { s, start, length };
  }
  const stem = fw.length > 5 ? fw.slice(0, fw.length - 2) : fw.slice(0, Math.max(3, fw.length - 1));
  const match = new RegExp("(^|[^a-z])(" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)").exec(fs);
  if (!match) {
    return { s, start: -1, length: 0 };
  }
  return { s, start: match.index + match[1].length, length: match[2].length };
}

function highlight(sentence, word) {
  const { s, start, length } = findWord(sentence, word);
  if (start < 0) {
    return esc(s);
  }
  return esc(s.slice(0, start)) + "<mark>" + esc(s.slice(start, start + length)) + "</mark>" + esc(s.slice(start + length));
}

function gap(sentence, word) {
  const { s, start, length } = findWord(sentence, word);
  if (start < 0) {
    return esc(s);
  }
  return esc(s.slice(0, start)) + "<b>" + s[start] + " _____</b>" + esc(s.slice(start + length));
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function speak(text) {
  if (S.muted || !("speechSynthesis" in window)) {
    return;
  }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {
  }
}

// ---------- level model, the placement test's curve ----------

const GRID = 200;
const LMIN = Math.log(20);
const LMAX = Math.log(60000);
const LS = Array.from({ length: GRID }, (_, i) => LMIN + (LMAX - LMIN) * i / (GRID - 1));

function normalize(b) {
  const sum = b.reduce((a, x) => a + x, 0);
  return b.map(x => x / sum);
}

function priorBelief(cutoff) {
  const mean = cutoff > 0 ? Math.log(cutoff / 0.78) : Math.log(400);
  const spread = cutoff > 0 ? 0.8 : 2.0;
  return normalize(LS.map(L => Math.exp(-0.5 * ((L - mean) / spread) ** 2)));
}

function knownChance(rank, L) {
  return 1 / (1 + Math.exp((Math.log(rank) - L) / 0.6));
}

function expectedKnown(belief, rank) {
  return belief.reduce((sum, b, i) => sum + b * knownChance(rank, LS[i]), 0);
}

// An answer is evidence about the level. Four options make a blind guess right a quarter of the time.
const LIKELIHOOD = {
  known: p => 0.97 * p + 0.25 * (1 - p),
  almost: p => 0.2 * p + 0.35 * (1 - p),
  new: p => 0.03 * p + 0.4 * (1 - p),
};

function updateBelief(belief, rank, outcome) {
  return normalize(belief.map((b, i) => b * LIKELIHOOD[outcome](knownChance(rank, LS[i]))));
}

function frontierRank(belief) {
  const mean = belief.reduce((sum, b, i) => sum + b * LS[i], 0);
  return Math.round(Math.exp(mean - 0.6 * Math.log(0.6 / 0.4)));
}

function levelName(rank) {
  if (rank < 1500) return "A1";
  if (rank < 4000) return "A2";
  if (rank < 9000) return "B1";
  return "B2";
}

// ---------- options: exactly one can be right ----------

function translationSet(list) {
  return new Set(list.map(normT));
}

function nearest(item, candidates, take) {
  const scored = candidates.map(c => ({
    c,
    d: Math.abs(Math.log(c.rank) - Math.log(item.rank)) + (c.deck === item.deck ? 0 : 1) + Math.random() * 0.3,
  }));
  scored.sort((a, b) => a.d - b.d);
  return shuffle(scored.slice(0, 8)).slice(0, take).map(x => x.c);
}

// A native-language distractor may not be any meaning of the word being asked, in any sense.
function nativeDistractors(item, taken, count) {
  const forbidden = translationSet(item.allTranslations.concat(item.sense.translations));
  const pool = ITEMS.filter(other =>
    other.pos === item.pos
    && other.word !== item.word
    && other.sense.translations.every(t => !forbidden.has(normT(t)))
    && !taken.has(normT(other.sense.translations[0])));
  const picks = [];
  for (const other of nearest(item, pool, 20)) {
    const text = clean(other.sense.translations[0]);
    if (picks.length < count && !taken.has(normT(text))) {
      taken.add(normT(text));
      picks.push(text);
    }
  }
  return picks;
}

// A French distractor may not have the asked meaning among any of its own translations.
function frenchDistractors(item, sense, count) {
  const asked = translationSet(sense.translations);
  const pool = ITEMS.filter(other =>
    other.pos === item.pos
    && other.word !== item.word
    && other.allTranslations.every(t => !asked.has(normT(t))));
  const seen = new Set();
  const picks = [];
  for (const other of nearest(item, pool, 20)) {
    if (picks.length < count && !seen.has(other.word)) {
      seen.add(other.word);
      picks.push(withArticle(other));
    }
  }
  return picks;
}

function makeQuestion(item, kind, role, sense, extra = {}) {
  let options;
  if (kind === "reverse") {
    options = [{ text: withArticle(item), correct: true }]
      .concat(frenchDistractors(item, sense, 3).map(text => ({ text, correct: false })));
  } else {
    const correct = clean(sense.translations[0]);
    const taken = new Set([normT(correct)]);
    const traps = [];
    if (kind === "context") {
      // The word's other meanings are the most telling wrong answers: they are what a learner who
      // knows only one meaning will reach for.
      const others = [item.sense].concat(item.others).filter(s => s !== sense);
      for (const other of others) {
        const text = clean(other.translations[0]);
        if (traps.length < 2 && !taken.has(normT(text))) {
          taken.add(normT(text));
          traps.push(text);
        }
      }
    }
    const fill = nativeDistractors(item, taken, 3 - traps.length);
    options = [{ text: correct, correct: true }]
      .concat(traps.map(text => ({ text, correct: false, trap: true })))
      .concat(fill.map(text => ({ text, correct: false })));
  }
  const clues = kind === "recognise" ? ["sentence", "fifty"] : kind === "reverse" ? ["gap", "fifty"] : ["fifty"];
  return {
    item, kind, role, sense,
    options: shuffle(options),
    clues,
    clueStep: 0,
    removed: new Set(),
    answered: false,
    chosen: null,
    outcome: null,
    decision: null,
    ...extra,
  };
}

// ---------- round ----------

const S = {
  screen: "start",
  decks: ["Nourriture"],
  placement: "none",
  length: 12,
  seen: new Set(),
  muted: false,
  round: null,
  message: "",
};

function key(item) {
  return item.word + "|" + item.pos;
}

function newRound() {
  const cutoff = PLACEMENTS.find(p => p.id === S.placement).cutoff;
  S.round = {
    belief: priorBelief(cutoff),
    questions: [],
    pending: [],
    used: new Set(),
    probes: 0,
    confirms: 0,
    previews: [],
    keepQuizzing: false,
    territory: false,
  };
  S.message = "";
  S.screen = "quiz";
  advance();
}

function freshKind(item) {
  if (item.pos !== "noun") {
    return "context";
  }
  if (frontierRank(S.round.belief) >= 4000 && Math.random() < 0.35) {
    return "reverse";
  }
  return "recognise";
}

function editDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let previous = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const saved = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, previous + (a[i - 1] === b[j - 1] ? 0 : 1));
      previous = saved;
    }
  }
  return row[b.length];
}

// A word spelled almost like its translation (croûton, crouton) says nothing about the learner:
// anyone reading English gets it. The picker leaves it out.
function isTransparent(item) {
  const word = fold(item.word);
  return item.sense.translations.slice(0, 2).some(t => {
    const translation = normT(t);
    return editDistance(word, translation) <= Math.max(1, Math.floor(Math.max(word.length, translation.length) / 4));
  });
}

function candidates() {
  return ITEMS.filter(item =>
    S.decks.includes(item.deck) && !S.seen.has(key(item)) && !S.round.used.has(item.word) && !isTransparent(item));
}

function nextQuestion() {
  const r = S.round;
  if (r.questions.length >= S.length) {
    return null;
  }
  const due = r.pending.findIndex(p => p.after <= r.questions.length);
  if (due >= 0) {
    return r.pending.splice(due, 1)[0].make();
  }
  const list = candidates();
  if (list.length === 0) {
    return r.pending.length ? r.pending.shift().make() : null;
  }
  const scored = list
    .map(item => ({ item, p: expectedKnown(r.belief, item.rank) }))
    .sort((a, b) => Math.abs(a.p - TARGET_CHANCE) - Math.abs(b.p - TARGET_CHANCE));
  const pick = scored[Math.floor(Math.random() * Math.min(3, scored.length))];
  r.used.add(pick.item.word);
  return makeQuestion(pick.item, freshKind(pick.item), "fresh", pick.item.sense, { chance: pick.p });
}

function advance() {
  const q = nextQuestion();
  if (!q) {
    finishRound();
    return;
  }
  S.round.questions.push(q);
  render();
  if (q.kind !== "reverse") {
    speak(q.item.word);
  }
}

function current() {
  const r = S.round;
  return r && r.questions[r.questions.length - 1];
}

function choose(index) {
  const q = current();
  if (!q || q.answered || q.removed.has(index)) {
    return;
  }
  q.chosen = index;
  const right = q.options[index].correct;
  settle(q, right ? (q.clueStep > 0 ? "almost" : "known") : "new");
}

function clue() {
  const q = current();
  if (!q || q.answered) {
    return;
  }
  if (q.clueStep >= q.clues.length) {
    settle(q, "new");
    return;
  }
  const kind = q.clues[q.clueStep];
  q.clueStep++;
  if (kind === "fifty") {
    const wrong = q.options.map((o, i) => i).filter(i => !q.options[i].correct);
    shuffle(wrong).slice(0, 2).forEach(i => q.removed.add(i));
  }
  if (kind === "sentence") {
    speak(q.item.word);
  }
  render();
}

function settle(q, outcome) {
  const r = S.round;
  q.answered = true;
  q.outcome = outcome;
  q.decision = outcome === "known" ? "know" : "learn";

  if (q.role === "fresh") {
    r.belief = updateBelief(r.belief, q.item.rank, outcome);
    const room = r.questions.length + 1 < S.length;
    if (outcome === "known" && room && q.chance < CONFIRM_BELOW && r.confirms < MAX_CONFIRMS) {
      r.confirms++;
      r.pending.push({
        after: r.questions.length + 2,
        make: () => makeQuestion(q.item, q.kind === "reverse" ? "recognise" : "reverse", "confirm", q.item.sense, { parent: q }),
      });
    } else if (outcome === "known" && room && q.item.others.length
               && q.item.others[0].weight >= PROBE_MIN_WEIGHT && r.probes < MAX_PROBES) {
      r.probes++;
      q.probeQueued = true;
      r.pending.push({
        after: r.questions.length + 2,
        make: () => makeQuestion(q.item, "context", "probe", q.item.others[0], { parent: q }),
      });
    }
    const fresh = r.questions.filter(x => x.role === "fresh" && x.answered);
    if (!r.keepQuizzing && fresh.length === NEW_TERRITORY_AFTER && fresh.every(x => x.outcome === "new")) {
      r.territory = true;
    }
  }

  if (q.role === "confirm") {
    q.decision = null;
    if (outcome !== "known") {
      q.parent.outcome = "almost";
      q.parent.decision = "learn";
    }
  }

  if (q.kind === "reverse") {
    speak(q.item.word);
  }
  render();
  const reveal = document.querySelector(".reveal");
  if (reveal) {
    reveal.scrollIntoView({ block: "nearest" });
  }
}

function next() {
  const r = S.round;
  if (r.territory) {
    r.territory = false;
    // Transparent words come back here: for a learner starting from nothing, la table is worth having.
    const list = ITEMS
      .filter(item => S.decks.includes(item.deck) && !S.seen.has(key(item)) && !r.used.has(item.word))
      .sort((a, b) => a.rank - b.rank)
      .slice(0, Math.max(6, S.length - r.questions.length));
    r.previews = list.map(item => ({ item, sense: item.sense, role: "preview", outcome: "new", decision: "learn" }));
    S.screen = "territory";
    render();
    return;
  }
  advance();
}

function finishRound() {
  const r = S.round;
  r.questions.filter(q => q.answered).forEach(q => S.seen.add(key(q.item)));
  r.previews.filter(p => p.accepted).forEach(p => S.seen.add(key(p.item)));
  S.screen = "end";
  render();
}

function results() {
  const r = S.round;
  return r.questions.filter(q => q.answered && q.role !== "confirm")
    .concat(r.previews.filter(p => p.accepted));
}

// ---------- rendering ----------

function topbar(title, left = "←", right = true) {
  return `<header class="phone-topbar">
    <button class="icon-btn" data-action="back" title="Back">${left}</button>
    <span class="title">${esc(title)}</span>
    ${right ? `<button class="icon-btn" data-action="mute" title="Sound">${S.muted ? "🔇" : "🔊"}</button>` : ""}
  </header>`;
}

function renderStart() {
  const deckRows = Object.keys(DATA).map(deck => {
    const on = S.decks.includes(deck);
    const checked = [...S.seen].filter(k => ITEMS.some(i => i.deck === deck && key(i) === k)).length;
    const pct = Math.min(100, (checked / DECK_TOTALS[deck]) * 100);
    return `<div class="row" data-action="deck" data-deck="${deck}">
      <div class="check ${on ? "on" : ""}">${on ? "✓" : ""}</div>
      <div class="grow">
        <div class="name">${esc(DECK_NAMES[deck])}</div>
        <div class="line2">${DECK_TOTALS[deck]} words · ${checked} checked</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    </div>`;
  }).join("");

  const placement = PLACEMENTS.map(p =>
    `<button class="chip ${S.placement === p.id ? "on" : ""}" data-action="placement" data-id="${p.id}">${p.label}</button>`).join("");

  return topbar("Discover", "←", false) + `
    <div class="scroll">
      <div class="section-label">Categories</div>
      ${deckRows}
      <div class="section-label">Words per round</div>
      <div class="stepper">
        <button data-action="len" data-d="-1">−</button><span>${S.length}</span><button data-action="len" data-d="1">+</button>
      </div>
      <div class="proto">
        <div>Prototype only: the placement result the round starts from</div>
        <div class="chips">${placement}</div>
      </div>
      ${S.message ? `<div class="note">${esc(S.message)}</div>` : ""}
    </div>
    <div class="footer">
      <button class="btn primary" data-action="start" ${S.decks.length ? "" : "disabled"}>Start</button>
    </div>`;
}

function promptBlock(q) {
  const item = q.item;
  const tag = `<span class="tag">${esc(DECK_NAMES[item.deck])}</span>`;
  if (q.kind === "recognise") {
    return `${tag}
      <div class="meta center">${posLabel(item)}</div>
      <div class="word">${esc(withArticle(item))}</div>`;
  }
  if (q.kind === "reverse") {
    const def = q.sense.definition ? `<div class="sub center">${esc(q.sense.definition)}</div>` : "";
    return `${tag}
      <div class="meta center">${posLabel(item)}</div>
      <div class="prompt-native">${esc(clean(q.sense.translations[0]))}</div>${def}`;
  }
  const lead = q.role === "probe"
    ? `<div class="sub">You know <b>${esc(withArticle(item))}</b> as “${esc(clean(item.sense.translations[0]))}”. Here?</div>`
    : `<div class="meta">${esc(withArticle(item))} · ${posLabel(item)}</div>`;
  return `${q.role === "probe" ? "" : tag}${lead}
    <div class="sentence">${highlight(q.sense.example, item.word)}</div>`;
}

function clueBlock(q) {
  const shown = q.clues.slice(0, q.clueStep);
  let html = "";
  if (shown.includes("sentence") && q.sense.example) {
    html += `<div class="clue">${highlight(q.sense.example, q.item.word)}</div>`;
  }
  if (shown.includes("gap") && q.sense.example) {
    html += `<div class="clue">${gap(q.sense.example, q.item.word)}</div>`;
  }
  return html;
}

function optionsBlock(q) {
  return `<div class="options">${q.options.map((o, i) => {
    const cls = ["opt"];
    if (q.removed.has(i)) cls.push("gone");
    if (q.answered && o.correct) cls.push("right");
    if (q.answered && q.chosen === i && !o.correct) cls.push("picked");
    const note = q.answered && q.chosen === i && !o.correct
      ? `<small>${o.trap ? "another meaning" : "your answer"}</small>`
      : "";
    return `<button class="${cls.join(" ")}" data-action="choose" data-i="${i}" ${q.answered || q.removed.has(i) ? "disabled" : ""}>
      <span>${esc(o.text)}</span>${note}</button>`;
  }).join("")}</div>`;
}

function decisionControl(entry, index, small) {
  const d = entry.decision;
  return `<div class="seg3 ${small ? "small" : ""}">
    <button class="learn ${d === "learn" ? "on" : ""}" data-action="decide" data-i="${index}" data-d="learn">Learn</button>
    <button class="know ${d === "know" ? "on" : ""}" data-action="decide" data-i="${index}" data-d="know">Know</button>
    <button class="skip ${d === "skip" ? "on" : ""}" data-action="decide" data-i="${index}" data-d="skip">Skip</button>
  </div>`;
}

function revealBlock(q, index) {
  const item = q.item;
  const sense = q.sense;
  const verdicts = {
    known: "Known",
    almost: "Almost: you got there with a clue",
    new: "New",
  };
  const meaning = [...new Set(sense.translations.map(clean))].slice(0, 3).join(" · ");
  let also = "";
  if (q.role === "probe") {
    also = `<div class="sub">Also: ${esc(clean(item.sense.translations[0]))}, the one you knew</div>`;
  } else if (!q.probeQueued && item.others.length) {
    also = `<div class="sub">Also: ${item.others.map(o => esc(clean(o.translations[0]))).join(" · ")}</div>`;
  }
  const example = sense.example
    ? `<div class="clue">${highlight(sense.example, item.word)}<div class="sub">${esc(sense.exampleTranslation || "")}</div></div>`
    : "";
  const control = q.role === "confirm" ? "" : decisionControl(q, index, false);
  const verdict = q.role === "confirm"
    ? (q.outcome === "known" ? "Confirmed" : "Moved to Almost")
    : verdicts[q.outcome];
  return `<div class="reveal">
    <div class="verdict ${q.outcome}">${verdict}</div>
    <div class="headline"><b>${esc(withArticle(item))}</b>
      ${item.phonetic ? `<span class="ph">${esc(item.phonetic)}</span>` : ""}
      <button class="speak" data-action="speak">🔊</button></div>
    <div>${esc(meaning)}</div>
    ${sense.definition ? `<div class="sub">${esc(sense.definition)}</div>` : ""}
    ${example}
    ${also}
    ${control}
  </div>`;
}

function renderQuiz() {
  const r = S.round;
  const q = current();
  const index = r.questions.length - 1;
  const segments = Array.from({ length: S.length }, (_, i) =>
    `<i class="${i < r.questions.filter(x => x.answered).length ? "done" : ""}"></i>`).join("");
  const learn = results().filter(x => x.decision === "learn");
  const tray = learn.length
    ? learn.map(x => `<span class="mini">${esc(x.role === "probe" ? x.item.word + " · " + clean(x.sense.translations[0]) : withArticle(x.item))}</span>`).join("")
    : "";
  const title = "Discover · " + S.decks.map(d => DECK_NAMES[d]).join(", ");

  let footer;
  if (q.answered) {
    footer = `<button class="btn primary" data-action="next">Next</button>`;
  } else {
    const label = q.clueStep >= q.clues.length ? "Show me" : q.clueStep === 0 ? "Not sure" : "Still not sure";
    footer = `<button class="btn" data-action="clue">${label}</button>`;
  }

  return topbar(title) + `
    <div class="scroll">
      <div class="segments">${segments}</div>
      <div class="tray">${tray}</div>
      <div class="card">
        ${promptBlock(q)}
        ${clueBlock(q)}
        ${optionsBlock(q)}
        ${q.answered ? revealBlock(q, index) : ""}
      </div>
    </div>
    <div class="footer">${footer}</div>`;
}

function renderTerritory() {
  const r = S.round;
  const deckNames = S.decks.map(d => DECK_NAMES[d]).join(", ");
  const rows = r.previews.map((p, i) => `<div class="row" data-action="preview" data-i="${i}">
      <div class="check ${p.decision === "learn" ? "on" : ""}">${p.decision === "learn" ? "✓" : ""}</div>
      <div class="grow"><div class="name">${esc(withArticle(p.item))}</div>
      <div class="line2">${esc(clean(p.sense.translations[0]))}</div></div>
      <button class="speak" data-action="speakword" data-w="${esc(p.item.word)}">🔊</button>
    </div>`).join("");
  return topbar("Discover · " + deckNames) + `
    <div class="scroll">
      <div class="word" style="font-size:24px;text-align:left">New ground</div>
      <div class="sub">The most common words in ${esc(deckNames)}:</div>
      ${rows}
    </div>
    <div class="footer">
      <button class="btn primary" data-action="takePreview">Collect ${r.previews.filter(p => p.decision === "learn").length}</button>
      <button class="btn ghost" data-action="keepQuizzing">Keep quizzing</button>
    </div>`;
}

function renderEnd() {
  const list = results();
  const groups = [
    ["learn", "To learn"],
    ["know", "Known"],
    ["skip", "Skipped"],
  ];
  const tagFor = x => x.role === "probe" ? "2nd meaning" : x.role === "preview" ? "" : x.outcome === "almost" ? "almost" : "";
  let body = "";
  groups.forEach(([d, label]) => {
    const entries = list.map((x, i) => ({ x, i })).filter(e => e.x.decision === d);
    if (!entries.length) return;
    body += `<div class="section-label">${label} · ${entries.length}</div>`;
    body += entries.map(({ x, i }) => `<div class="result">
      <div class="top"><b>${esc(withArticle(x.item))}</b><span>${esc(clean(x.sense.translations[0]))}</span><em>${tagFor(x)}</em></div>
      ${decisionControl(x, i, true)}
    </div>`).join("");
  });
  const learnCount = list.filter(x => x.decision === "learn").length;
  const coverage = S.decks.map(deck => {
    const checked = [...S.seen].filter(k => ITEMS.some(i => i.deck === deck && key(i) === k)).length;
    return `<div><div class="sub">${esc(DECK_NAMES[deck])}: ${checked} of ${DECK_TOTALS[deck]} checked</div>
      <div class="bar"><i style="width:${Math.max(1, Math.min(100, checked / DECK_TOTALS[deck] * 100))}%"></i></div></div>`;
  }).join("");
  return topbar("Discover · Results", "←", false) + `
    <div class="scroll">
      ${coverage}
      ${body || `<div class="sub">Nothing answered.</div>`}
      ${S.message ? `<div class="note">${esc(S.message)}</div>` : ""}
    </div>
    <div class="footer">
      <button class="btn primary" data-action="learnNow" ${learnCount ? "" : "disabled"}>Learn ${learnCount} now</button>
      <button class="btn" data-action="addPool" ${learnCount ? "" : "disabled"}>Add to My Vocabulary</button>
      <button class="btn ghost" data-action="again">Another round</button>
    </div>`;
}

function renderModel() {
  const el = document.getElementById("model");
  const r = S.round;
  if (!r || S.screen === "start") {
    const cutoff = PLACEMENTS.find(p => p.id === S.placement).cutoff;
    el.innerHTML = `<h3>Model · prototype only</h3>
      <div><span class="k">prior frontier</span> ${cutoff ? "rank " + cutoff.toLocaleString() : "none, centred on rank 400"}</div>
      <div><span class="k">target</span> P(known) ≈ ${TARGET_CHANCE}</div>
      <div><span class="k">sample</span> ${ITEMS.length} meanings from 2 decks</div>`;
    return;
  }
  const q = current();
  const frontier = frontierRank(r.belief);
  const max = Math.max(...r.belief);
  const curve = r.belief.filter((_, i) => i % 5 === 0).map(b => `<i style="height:${(b / max) * 100}%"></i>`).join("");
  const history = r.questions.filter(x => x.answered).map(x =>
    `<li>${esc(x.item.word)} <span class="k">#${x.item.rank} ${x.role === "fresh" ? x.kind : x.role}</span> ${x.outcome}</li>`).join("");
  el.innerHTML = `<h3>Model · prototype only</h3>
    <div><span class="k">frontier</span> rank ~${frontier.toLocaleString()} (${levelName(frontier)})</div>
    <div class="curve">${curve}</div>
    <div class="k" style="display:flex;justify-content:space-between"><span>rank 20</span><span>60,000</span></div>
    ${q && S.screen === "quiz" ? `<div style="margin-top:8px"><span class="k">now</span> ${esc(q.item.word)} · #${q.item.rank}
      · ${q.role}${q.chance !== undefined ? " · P(known) " + q.chance.toFixed(2) : ""}</div>
      <div><span class="k">kind</span> ${q.kind} · <span class="k">clues</span> ${q.clues.join(" → ")} → show</div>` : ""}
    <div><span class="k">probes</span> ${r.probes}/${MAX_PROBES} · <span class="k">confirms</span> ${r.confirms}/${MAX_CONFIRMS}</div>
    <ol>${history}</ol>`;
}

function render() {
  const phone = document.getElementById("phone");
  const view = { start: renderStart, quiz: renderQuiz, territory: renderTerritory, end: renderEnd }[S.screen];
  phone.innerHTML = view();
  renderModel();
}

// ---------- events ----------

document.addEventListener("click", event => {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const r = S.round;

  if (action === "deck") {
    const deck = el.dataset.deck;
    S.decks = S.decks.includes(deck) ? S.decks.filter(d => d !== deck) : S.decks.concat(deck);
    render();
  } else if (action === "placement") {
    S.placement = el.dataset.id;
    render();
  } else if (action === "len") {
    S.length = Math.min(15, Math.max(10, S.length + Number(el.dataset.d)));
    render();
  } else if (action === "start" || action === "again") {
    if (S.decks.length) newRound();
  } else if (action === "choose") {
    choose(Number(el.dataset.i));
  } else if (action === "clue") {
    clue();
  } else if (action === "next") {
    next();
  } else if (action === "decide") {
    const list = S.screen === "end" ? results() : r.questions;
    const entry = list[Number(el.dataset.i)];
    if (entry) entry.decision = el.dataset.d;
    render();
  } else if (action === "speak") {
    const q = current();
    if (q) { const was = S.muted; S.muted = false; speak(q.item.word); S.muted = was; }
  } else if (action === "speakword") {
    event.stopPropagation();
    const was = S.muted; S.muted = false; speak(el.dataset.w); S.muted = was;
  } else if (action === "mute") {
    S.muted = !S.muted;
    render();
  } else if (action === "preview") {
    const p = r.previews[Number(el.dataset.i)];
    p.decision = p.decision === "learn" ? "skip" : "learn";
    render();
  } else if (action === "takePreview") {
    r.previews.forEach(p => { p.accepted = p.decision === "learn"; });
    finishRound();
  } else if (action === "keepQuizzing") {
    r.previews = [];
    r.keepQuizzing = true;
    S.screen = "quiz";
    advance();
  } else if (action === "back") {
    if (S.screen === "quiz" || S.screen === "territory") {
      finishRound();
    } else {
      S.screen = "start";
      S.message = "";
      render();
    }
  } else if (action === "learnNow" || action === "addPool") {
    const list = results();
    const learn = list.filter(x => x.decision === "learn").length;
    const know = list.filter(x => x.decision === "know").length;
    S.message = action === "learnNow"
      ? `Would start Intensive Training with these ${learn} meanings, and mark ${know} known.`
      : `Would add ${learn} cards to the pool and mark ${know} known.`;
    render();
  }
});

render();
</script>
</body>
</html>
