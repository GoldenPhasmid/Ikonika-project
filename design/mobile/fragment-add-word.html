<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile · Add word</title>
  <link rel="stylesheet" href="../v3/wireframe.css">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="phone">

    <header class="phone-topbar">
      <button class="icon-btn bare">←</button>
      <span class="title">Add word</span>
    </header>

    <div class="phone-content" style="gap:20px">

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">French word</span>
        <input type="text" placeholder="le marché" style="width:100%;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:15px;background:var(--wf-panel);outline:none">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Translation</span>
        <input type="text" placeholder="market" style="width:100%;height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;font-size:15px;background:var(--wf-panel);outline:none">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Part of speech</span>
          <div style="height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:15px;color:var(--wf-mid)">noun</span>
            <span style="font-size:13px;color:var(--wf-mid)">▾</span>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;color:var(--wf-mid);text-transform:uppercase;letter-spacing:0.08em">Add to deck</span>
          <div style="height:44px;border:1px solid var(--wf-line);border-radius:2px;padding:0 16px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:15px">Mercado y comida</span>
          <span style="font-size:13px;color:var(--wf-mid)">▾</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;padding-top:8px">
        <button class="btn primary" style="width:100%;height:48px;font-size:15px">Add</button>
        <button class="btn ghost" style="width:100%;height:48px;font-size:15px">Cancel</button>
      </div>

    </div>

  </div>
</body>
</html>
