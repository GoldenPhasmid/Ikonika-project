<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desktop.css">
<style>
    body
    {
        margin: 0;
        min-height: 100vh;
        background: #161513;
        color: #d8d5cc;
        font-family: "Inter", "Segoe UI", sans-serif;
        font-size: 13px;
    }

    .viewer
    {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
        padding: 12px 24px;
        border-bottom: 1px solid #2c2a27;
    }

    .viewer-group
    {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .viewer-group > span
    {
        color: #8f8b82;
    }

    .viewer-group button
    {
        padding: 5px 10px;
        border: 1px solid #3a3834;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
    }

    .viewer-group button[aria-pressed="true"]
    {
        background: #d8d5cc;
        border-color: #d8d5cc;
        color: #161513;
    }

    .viewer-hint
    {
        margin-left: auto;
        color: #8f8b82;
    }

    .stage
    {
        display: grid;
        place-items: center;
        padding: 24px;
    }

    .frame-holder
    {
        position: relative;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    .window
    {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--panel);
        color: var(--text);
        font-family: var(--font);
    }

    .placeholder
    {
        display: grid;
        place-items: center;
        height: 100%;
        font-size: 64px;
        font-weight: 600;
        color: var(--muted);
    }
</style>
</head>
<body>

<svg width="0" height="0" style="position: absolute">
    <symbol id="i-today" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
    <symbol id="i-decks" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-reader" viewBox="0 0 24 24"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></symbol>
    <symbol id="i-vocabulary" viewBox="0 0 24 24"><path d="M5 5v14M9 5v14M13 5v14M16 5l4 14"/></symbol>
    <symbol id="i-words" viewBox="0 0 24 24"><path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 4-3 7-6 8M13 21l4-9 4 9M14.5 18h5"/></symbol>
</svg>

<div class="viewer">
    <div class="viewer-group" data-setting="duration">
        <span>Duration</span>
        <button data-value="240" aria-pressed="false">240 ms</button>
        <button data-value="320" aria-pressed="false">320 ms</button>
        <button data-value="420" aria-pressed="true">420 ms</button>
    </div>
    <div class="viewer-group" data-setting="speed">
        <span>Speed</span>
        <button data-value="1" aria-pressed="true">1×</button>
        <button data-value="0.5" aria-pressed="false">0.5×</button>
        <button data-value="0.2" aria-pressed="false">0.2×</button>
    </div>
    <div class="viewer-group" data-setting="theme">
        <span>Theme</span>
        <button data-value="light" aria-pressed="false">Light</button>
        <button data-value="dark" aria-pressed="true">Dark</button>
    </div>
    <div class="viewer-hint">Click a destination, or use the Left and Right keys.</div>
</div>

<div class="stage">
    <div class="frame-holder" id="holder">
        <div class="window" id="window">

            <header class="top-bar">
                <div class="language-badge">EN</div>
                <div class="crumbs"><span class="crumb" id="crumb"></span></div>
                <nav class="destinations" id="destinations"></nav>
            </header>

            <main class="screens" id="screens"></main>
        </div>
    </div>
</div>

<script>
    const FrameWidth = 1280;
    const FrameHeight = 800;

    const frame = document.getElementById("window");
    const holder = document.getElementById("holder");
    const crumb = document.getElementById("crumb");
    const destinations = document.getElementById("destinations");
    const screens = document.getElementById("screens");

    const rootStyle = getComputedStyle(document.documentElement);
    const EaseOut = rootStyle.getPropertyValue("--ease-out").trim();

    const Settings = { duration: parseFloat(rootStyle.getPropertyValue("--motion-page")), speed: 1 };

    const Pages =
    [
        { name: "First", icon: "today" },
        { name: "Second", icon: "decks" },
        { name: "Third", icon: "reader" },
        { name: "Fourth", icon: "vocabulary" },
        { name: "Fifth", icon: "words" }
    ];

    const buttons = [];
    const views = [];
    let current = 0;

    function offsetOf(view)
    {
        const matrix = new DOMMatrixReadOnly(getComputedStyle(view).transform);

        return matrix.m41;
    }

    function slide(view, from, to)
    {
        view.getAnimations().forEach(animation => animation.cancel());

        return view.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }],
                            { duration: Settings.duration / Settings.speed, easing: EaseOut, fill: "forwards" });
    }

    function go(target)
    {
        if (target === current || target < 0 || target >= Pages.length)
        {
            return;
        }

        const width = screens.clientWidth;
        const direction = target > current ? 1 : -1;
        const leaving = views[current];
        const arriving = views[target];

        views.forEach((view, index) =>
        {
            if (index !== current && index !== target)
            {
                view.getAnimations().forEach(animation => animation.cancel());
                view.style.visibility = "hidden";
            }
        });

        const leavingFrom = offsetOf(leaving);
        const arrivingFrom = arriving.style.visibility === "visible" ? offsetOf(arriving) : direction * width;

        leaving.style.visibility = "visible";
        arriving.style.visibility = "visible";

        slide(leaving, leavingFrom, -direction * width);
        slide(arriving, arrivingFrom, 0).finished.then(() =>
        {
            if (views[current] === arriving)
            {
                leaving.style.visibility = "hidden";
            }
        }).catch(() => {});

        buttons[current].classList.remove("current");
        buttons[target].classList.add("current");
        crumb.textContent = Pages[target].name;
        current = target;
    }

    Pages.forEach((page, index) =>
    {
        const button = document.createElement("button");
        button.className = "icon-button destination";
        button.setAttribute("aria-label", page.name);
        button.innerHTML = `<svg class="icon"><use href="#i-${page.icon}"/></svg>`;
        button.addEventListener("click", () => go(index));
        destinations.append(button);
        buttons.push(button);

        const view = document.createElement("section");
        view.className = "screen";
        view.style.visibility = index === 0 ? "visible" : "hidden";
        view.innerHTML = `<div class="placeholder">${page.name}</div>`;
        screens.append(view);
        views.push(view);
    });

    buttons[0].classList.add("current");
    crumb.textContent = Pages[0].name;

    document.addEventListener("keydown", event =>
    {
        if (event.key === "ArrowRight")
        {
            go(current + 1);
        }
        else if (event.key === "ArrowLeft")
        {
            go(current - 1);
        }
    });

    document.querySelectorAll("[data-setting]").forEach(group =>
    {
        group.querySelectorAll("button").forEach(button =>
        {
            button.addEventListener("click", () =>
            {
                const name = group.dataset.setting;
                const value = button.dataset.value;

                group.querySelectorAll("button").forEach(other => other.setAttribute("aria-pressed", String(other === button)));

                if (name === "theme")
                {
                    document.documentElement.dataset.theme = value;
                    return;
                }

                Settings[name] = Number(value);
            });
        });
    });

    function fit()
    {
        const viewer = document.querySelector(".viewer").offsetHeight;
        const scale = Math.min(1, (innerWidth - 48) / FrameWidth, (innerHeight - viewer - 48) / FrameHeight);

        frame.style.transform = `scale(${scale})`;
        holder.style.width = FrameWidth * scale + "px";
        holder.style.height = FrameHeight * scale + "px";
    }

    addEventListener("resize", fit);
    fit();
</script>
</body>
</html>
