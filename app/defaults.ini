; Defaults this build starts with, for someone who has never opened Settings.
;
; Three layers decide a value: what is compiled into the rules structs, then this file, then
; whatever the user chose in Settings. Editing a value here changes what a fresh install does,
; and changes nothing for anyone who has already set that particular thing themselves.
;
; A key that is absent, misspelled or unparseable falls through to the compiled default rather
; than failing, so a broken line here cannot stop the app from starting.
;
; Sections and key names are the same ones the user's own settings use; see the *Key constants at
; the top of core/src/FTSettings.cpp.
;
; Desktop reads this file from beside the executable. Android carries it inside the APK, so a
; change there takes a rebuild.

[schedule]
; Days between reviews, one per interval, comma separated.
intervalDays=1,2,4,14,40,120
maximumDaysInFirstStage=3
firstStageFailureReturnsToPool=false
; Whether a review left past its date loses a box.
missedReviewDemotes=true

[intensiveLearning]
cardsPerExercise=10
repeatsToMaster=3
; How many training sessions a day is meant to take. The Today screen's goal is this times
; trainingWordCount.
sessionsPerDay=1
; How many words a training session collects. Clamped to 10-25, steps of 5.
trainingWordCount=15
; Whether "eleve" is accepted where "élève" was asked for.
requireExactAccents=true

[repetition]
requireExactAccents=true

[answers]
; Whether "chien" is accepted where "le chien" was asked for.
allowMissingArticle=false

[exercises]
; Which side a practice question shows: 0 the word being learned, 1 either, 2 its translation.
askWith=1

[languages]
; ISO 639-1, lowercase. Ignored when no dictionary for the pair is installed.
target=fr
native=en

[dictionary]
; Example sentences under each meaning. 0 hides them.
examplesPerSense=3
; Id of the site "Search the web" opens. The catalog lists the sites; an id it does not list falls
; back to the first one serving the language pair.
webSearchSource=reverso

[update]
; Where the app reads what it can download and which build is published. Point this elsewhere to
; test against another catalog without rebuilding.
catalogUrl=https://raw.githubusercontent.com/GoldenPhasmid/ikonika-releases/main/catalog.json

[startup]
; Desktop only.
launchAtStartup=true

[reader]
; Android only: the volume keys turn the page while reading.
volumeKeysTurnPages=true
; Shades the words being learned and underlines the finished ones in EPUB, FB2 and TXT books.
highlightVocabulary=false

[essentialVerbs]
; Verbs every learner is taken to know, present tense included, when sentences are picked for
; sentence training and Discover. Irregular verbs open the most sentences: a regular present is
; known as soon as the verb is. A language without a list takes its ten best-ranked verbs.
fr=être,avoir,aller,faire,parler,dire,pouvoir,vouloir,venir,devoir
es=ser,estar,tener,hacer,haber,ir,decir,saber,querer,ver
en=be,do,have,get,can,go,know,come,will,must
de=sein,haben,werden,können,wollen,wissen,kommen,gehen,müssen,geben
it=essere,avere,fare,potere,stare,andare,sapere,volere,dovere,dire
pt=ser,estar,ter,ir,fazer,dizer,poder,querer,saber,ver

[reminder]
enabled=true
; Minutes from midnight: 19 * 60 is 19:00.
timeOfDayMinutes=1140
message=
